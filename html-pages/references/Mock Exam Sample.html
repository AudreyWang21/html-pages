<title>Mock Midterm</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: specimen-drawer rail on the left (one cell per question, coloured by result), question sheets on the right. */
:root {
  --paper: #eef1ec;
  --sheet: #fbfcfa;
  --ink: #1b2a23;
  --muted: #5a6a61;
  --line: #d3dbd4;
  --accent: #1e5e4a;
  --accent-soft: #dcebe4;
  --label: #b8861b;
  --right: #2c7a4b;
  --right-soft: #dff0e5;
  --wrong: #b0443a;
  --wrong-soft: #f6e0dd;
  --dk: #8a6d1e;
  --dk-soft: #f3ead2;
  --empty: #dfe5e0;
  --f-display: "Young Serif", Georgia, "Times New Roman", serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #131a17; --sheet: #1b2420; --ink: #e3ebe5; --muted: #9aaaa1; --line: #2f3b35;
  --accent: #6cc3a2; --accent-soft: #1f3a30; --label: #e0b04a;
  --right: #6fcf93; --right-soft: #1d3a28; --wrong: #f08a7e; --wrong-soft: #45231f;
  --dk: #e0bf6a; --dk-soft: #3b321b; --empty: #2a3530; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #131a17; --sheet: #1b2420; --ink: #e3ebe5; --muted: #9aaaa1; --line: #2f3b35;
  --accent: #6cc3a2; --accent-soft: #1f3a30; --label: #e0b04a;
  --right: #6fcf93; --right-soft: #1d3a28; --wrong: #f08a7e; --wrong-soft: #45231f;
  --dk: #e0bf6a; --dk-soft: #3b321b; --empty: #2a3530; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 16px/1.55 var(--f-body); padding-inline: 16px; padding-block: 0 48px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code { font-family: var(--f-mono); font-size: .9em; }

/* top bar */
header.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--paper); border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 12px;
  margin-inline: -16px; padding-inline: 16px;
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font: 400 1.45rem/1.1 var(--f-display); margin: 0; letter-spacing: .01em; }
.brand .date { font: 600 .72rem var(--f-mono); color: var(--label); letter-spacing: .08em; text-transform: uppercase; }
.tally { font: .85rem var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; display: flex; gap: 14px; flex-wrap: wrap; }
.tally b { color: var(--ink); font-weight: 600; }
.tally .r b { color: var(--right); } .tally .w b { color: var(--wrong); } .tally .d b { color: var(--dk); }
.controls { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--sheet); }
.seg button { border: 0; background: none; padding: 6px 12px; font-size: .85rem; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--sheet); }
.btn { border: 1px solid var(--line); background: var(--sheet); border-radius: 6px; padding: 6px 12px; font-size: .85rem; }
.btn:hover { border-color: var(--accent); }
.btn.danger.solid { background: var(--wrong); color: var(--sheet); border-color: var(--wrong); }
/* Reset asks which answers to clear ("Clear: Missed 15 / Marked 3 / All 40 / Cancel"), then offers Undo for a few seconds,
   in a small panel under the button so the header never reflows */
.clearbox { position: relative; display: inline-flex; }
.clearbox .pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 7; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; white-space: nowrap;
  width: max-content; max-width: calc(100vw - 16px);
  background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; box-shadow: 0 4px 14px rgb(0 0 0 / .15); }
.clearbox .pop button[disabled] { opacity: .45; cursor: default; }
@media (max-width: 820px) { .clearbox .pop { right: auto; left: 0; } }
.clearbox .ask { font-size: .85rem; font-weight: 700; color: var(--wrong); }
.clearbox .done { font-size: .85rem; color: var(--muted); }

/* layout */
.wrap { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 28px; padding-top: 20px; align-items: start; }
nav.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); max-height: calc(100vh - 96px); overflow: auto; display: grid; gap: 6px; padding-bottom: 12px; }
.scope { text-align: left; border: 1px solid transparent; background: none; border-radius: 8px; padding: 9px 10px; display: grid; gap: 6px; }
.scope:hover { background: var(--sheet); }
.scope[aria-current="true"] { background: var(--sheet); border-color: var(--line); box-shadow: inset 3px 0 0 var(--accent); }
.scope .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.scope .name { font-weight: 700; font-size: .92rem; }
.scope .count { font: .75rem var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tray { display: flex; flex-wrap: wrap; gap: 3px; }
.cell { width: 11px; height: 11px; border-radius: 2px; background: var(--empty); border: 0; padding: 0; }
.cell.seen { background: var(--muted); }
.cell.right { background: var(--right); } .cell.wrong { background: var(--wrong); } .cell.dk { background: var(--dk); }
.cell.flagged { box-shadow: inset 0 0 0 2px var(--label); }
.cell:hover { outline: 1px solid var(--ink); }
.rail .sep { height: 1px; background: var(--line); margin: 6px 4px; }
.legend { font-size: .75rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 10px; padding: 4px 10px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

/* main */
main { min-width: 0; display: grid; gap: 18px; }
.scope-head { display: grid; gap: 4px; }
.scope-head h2 { font: 400 1.6rem/1.2 var(--f-display); margin: 0; text-wrap: balance; }
.scope-head p { margin: 0; color: var(--muted); font-size: .92rem; }
h3.sec { font: 600 .74rem var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin: 14px 0 -6px; }
.empty { color: var(--muted); padding: 30px 0; }

article.q { background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; display: grid; gap: 12px; scroll-margin-top: 90px; }
article.q.flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 3px var(--label); } to { box-shadow: 0 0 0 3px transparent; } }
.qhead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.qid { font: 600 .8rem var(--f-mono); color: var(--label); letter-spacing: .04em; }
.qtitle { font-weight: 700; }
.qtitle.hidden { color: var(--muted); font-weight: 400; font-style: italic; font-size: .85rem; }
.flag { margin-left: auto; border: 1px solid transparent; background: none; border-radius: 5px; padding: 1px 8px; font: .78rem var(--f-mono); color: var(--muted); }
.flag:hover { border-color: var(--line); }
.flag[aria-pressed="true"] { color: var(--label); border-color: var(--label); }
article.q.is-flagged { box-shadow: inset 3px 0 0 var(--label); }
.qnum { font: .75rem var(--f-mono); color: var(--muted); }
.stem p { margin: 0 0 .5em; } .stem p:last-child { margin-bottom: 0; }
.sec-intro { color: var(--muted); font-size: .88rem; margin-top: 4px; }
.sec-intro p { margin: 0; }
.shared { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; font-size: .92rem; }
.tbl { overflow-x: auto; margin-top: 8px; }
.tbl table { border-collapse: collapse; font: .88rem var(--f-mono); font-variant-numeric: tabular-nums; background: var(--sheet); }
.tbl th, .tbl td { border: 1px solid var(--line); padding: 4px 12px; text-align: center; }
.tbl th:first-child, .tbl td:first-child { text-align: left; font-weight: 600; }
.stem figure { margin: 6px 0; } .stem img { max-width: min(100%, 620px); border-radius: 6px; border: 1px solid var(--line); background: #fff; }
.opts { display: grid; gap: 7px; }
.opt { display: grid; grid-template-columns: 28px minmax(0,1fr); gap: 10px; align-items: start; text-align: left; border: 1px solid var(--line); background: var(--sheet); border-radius: 8px; padding: 9px 12px; }
.opt:hover:not([disabled]) { border-color: var(--accent); background: var(--accent-soft); }
.opt .k { font: 600 .85rem/1.55 var(--f-mono); color: var(--muted); }
.opt.idk { border-style: dashed; color: var(--muted); }
.opt[disabled] { cursor: default; }
.opt.picked { border-color: var(--accent); background: var(--accent-soft); }
.opt.is-right { border-color: var(--right); background: var(--right-soft); }
.opt.is-wrong { border-color: var(--wrong); background: var(--wrong-soft); }
.opt.is-right.missed { border-style: dashed; background: var(--sheet); }
.opt.is-right.missed .mark { color: var(--wrong); }
.opt.is-dk { border-color: var(--dk); background: var(--dk-soft); }
.opt .mark { font: 600 .72rem var(--f-mono); letter-spacing: .06em; text-transform: uppercase; margin-left: 8px; }
.opt.is-right .mark { color: var(--right); } .opt.is-wrong .mark { color: var(--wrong); } .opt.is-dk .mark { color: var(--dk); }
.multi-hint { font-size: .82rem; color: var(--muted); }
.reveal { border-top: 1px dashed var(--line); padding-top: 12px; display: grid; gap: 8px; font-size: .95rem; }
.reveal .verdict { font: 600 .78rem var(--f-mono); letter-spacing: .08em; text-transform: uppercase; }
.verdict.right { color: var(--right); } .verdict.wrong { color: var(--wrong); } .verdict.dk { color: var(--dk); }
.reveal p { margin: 0 0 .4em; } .reveal ul { margin: 0; padding-left: 1.2em; }
.reveal .src { font-size: .8rem; color: var(--muted); }
.reveal .note { background: var(--dk-soft); border-radius: 6px; padding: 8px 10px; font-size: .88rem; }
.qfoot { display: flex; gap: 8px; }
.link { border: 0; background: none; color: var(--accent); padding: 0; font-size: .85rem; text-decoration: underline; text-underline-offset: 3px; }

.totop { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 6; box-shadow: 0 2px 8px rgb(0 0 0 / .18); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: 6px; font-size: .88rem; z-index: 9; }
textarea.fallback { width: 100%; min-height: 160px; font: .8rem var(--f-mono); }

@media (max-width: 820px) {
  .wrap { grid-template-columns: minmax(0,1fr); gap: 14px; }
  nav.rail { position: static; max-height: none; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); padding-bottom: 6px; }
  .rail .sep, .legend { display: none; }
  .brand .date { display: none; }
  .controls { margin-left: 0; }
}
/* portrait (e.g. a rotated monitor): the header can wrap to two rows, so the sticky rail and jump targets
   sit below its measured height (--hdr, set by script) instead of the fixed one-row offset */
@media (orientation: portrait) and (min-width: 821px) {
  nav.rail { top: calc(env(safe-area-inset-top, 0px) + var(--hdr, 60px) + 16px); max-height: calc(100vh - var(--hdr, 60px) - 36px); }
  article.q { scroll-margin-top: calc(var(--hdr, 60px) + 30px); }
}
@media (prefers-reduced-motion: reduce) { article.q.flash { animation: none; } html { scroll-behavior: auto; } }
</style>

<header class="bar">
  <div class="brand"><h1>Mock Midterm</h1></div>
  <div class="tally" id="tally"></div>
  <div class="controls">
    <div class="seg" role="group" aria-label="Question order">
      <button id="ord-seq" type="button">In order</button>
      <button id="ord-rnd" type="button">Random</button>
    </div>
    <button class="btn" id="reshuffle" type="button">Reshuffle</button>
    <button class="btn" id="copy" type="button">Copy misses &amp; marks</button>
    <span class="clearbox" id="clearbox"><button class="btn danger" id="reset" type="button" title="Clear answers: missed, marked or all (asks first; marks are kept)">Reset</button></span>
  </div>
</header>

<div class="wrap">
  <nav class="rail" id="rail" aria-label="Question sets"></nav>
  <main id="main"></main>
</div>

<button class="btn totop" id="totop" type="button" hidden>Top ↑</button>
<script>
const DATA = {"parts": [{"title": "Part 1 · Phylogeny (P)", "intro": "Trees are written in bracket notation: each pair of brackets is one node. In (A, (B, C)), B and C are sisters and A branches off first.", "sections": [{"title": "Introduction: the real diversity of eukaryotes", "ids": ["P1"], "intro": ""}, {"title": "Taxonomy and species concepts", "ids": ["P2", "P3", "P4", "P5", "P6", "P7", "P8"], "intro": ""}, {"title": "Reading phylogenetic trees", "ids": ["P9", "P10", "P11", "P12", "P13", "P14", "P15"], "intro": ""}, {"title": "Characters: homology and homoplasy", "ids": ["P16", "P17", "P18", "P19", "P20", "P21"], "intro": ""}, {"title": "Apomorphy, plesiomorphy, synapomorphy", "ids": ["P22", "P23", "P24"], "intro": ""}, {"title": "Molecular data and the molecular clock", "ids": ["P25", "P26", "P27"], "intro": ""}, {"title": "Parsimony", "ids": ["P28", "P29", "P30"], "intro": ""}]}, {"title": "Part 2 · Eukaryotes and life cycles (E)", "intro": "", "sections": [{"title": "Domains, kingdoms and supergroups", "ids": ["E1", "E2", "E3", "E4", "E5", "E6", "E7"], "intro": ""}, {"title": "Where familiar groups sit", "ids": ["E8", "E9", "E10", "E11"], "intro": ""}, {"title": "What makes a eukaryote, and how cells move", "ids": ["E12", "E13", "E14", "E15"], "intro": ""}, {"title": "Life cycles: the three themes and animals", "ids": ["E16", "E17", "E18", "E19", "E20"], "intro": ""}, {"title": "Sex and gametes", "ids": ["E21", "E22", "E23", "E24"], "intro": ""}, {"title": "Meiosis and mitosis", "ids": ["E25"], "intro": ""}, {"title": "Single-celled life cycles, alternation of generations", "ids": ["E26", "E27", "E28", "E29", "E30"], "intro": ""}]}, {"title": "Part 3 · Animals (A)", "intro": "", "sections": [{"title": "What is an animal?", "ids": ["A1", "A2", "A3", "A4"], "intro": ""}, {"title": "Porifera and Cnidaria", "ids": ["A5", "A6", "A7", "A8"], "intro": ""}, {"title": "Bilateria: development and cephalization", "ids": ["A9", "A10", "A11"], "intro": ""}, {"title": "Lophotrochozoa: Annelida and Mollusca", "ids": ["A12", "A13", "A14", "A15", "A16", "A17"], "intro": ""}, {"title": "Ecdysozoa: Nematoda, Tardigrada, Arthropoda", "ids": ["A18", "A19", "A20", "A21", "A22", "A23"], "intro": ""}, {"title": "Deuterostomes: Echinodermata and Chordata", "ids": ["A24", "A25", "A26", "A27", "A28", "A29", "A30"], "intro": ""}]}, {"title": "Part 4 · Red algae, green algae, land plants (G)", "intro": "", "sections": [{"title": "Archaeplastida and the red algae", "ids": ["G1", "G2", "G3", "G4", "G5", "G6"], "intro": ""}, {"title": "Alternation of generations", "ids": ["G7", "G8", "G9", "G10", "G11", "G12", "G13", "G14", "G15"], "intro": ""}, {"title": "Green algae (Chlorophyta)", "ids": ["G16", "G17", "G18", "G19", "G20", "G21", "G22", "G23", "G24"], "intro": ""}, {"title": "Chara (stoneworts) and the move to land", "ids": ["G25", "G26", "G27", "G28", "G29", "G31"], "intro": ""}]}, {"title": "Part 5 · Extra practice (M)", "intro": "", "sections": [{"title": "Green algae", "ids": ["M1", "M2", "M3", "M4", "M5"], "intro": ""}, {"title": "Trees", "ids": ["M6", "M7", "M8", "M9"], "intro": ""}]}], "questions": [{"id": "P1", "title": "Who dominates eukaryotic diversity?", "part": 0, "source": "", "stem": "<p>True or false: once genetic data are used to identify organisms, animals (Metazoa) turn out to make up the largest share of eukaryotic diversity.<\/p>", "options": [{"k": "A", "t": "True"}, {"k": "B", "t": "False"}], "answer": "<p><strong>B. False.<\/strong> The pie chart flips: with genetic data, protists (mostly single-celled) fill most of the circle, and animals are only a tiny sliver. The traditional-view pie, where animals take about half, is the one the genetic data overturned.<\/p>", "note": "", "key": ["B"], "tf": true}, {"id": "P2", "title": "Why bother with formal names?", "part": 0, "source": "", "stem": "<p>Saying \"I found an edible mushroom in the forest\" is a classic way to show why biologists use formal scientific names. What is the main reason?<\/p>", "options": [{"k": "A", "t": "So that professionals anywhere in the world know they are talking about exactly the same organism, since a common name can cover many species or differ between places"}, {"k": "B", "t": "Because a Latin name tells you how long ago a species diverged from its relatives"}, {"k": "C", "t": "Because a species must have a Latin name before the biological species concept can be applied to it"}, {"k": "D", "t": "Because formal names make building phylogenetic trees unnecessary"}], "answer": "<p><strong>A.<\/strong> \"Edible mushroom\" could mean many species, some with deadly look-alikes, and the same common name can mean different species in North America, China or Brazil. A formal name guarantees that everyone is talking about the same organism. Names carry no dates (B), and naming is the <em>taxonomy<\/em> step that phylogeny builds on, not a replacement for it (D).<\/p>", "note": "", "key": ["A"], "tf": false}, {"id": "P3", "title": "The museum drawer", "part": 0, "source": "", "stem": "<p>A curator flattens a newly collected alga, compares it under a microscope with the single preserved specimen that anchors a species name, and declares it the same species because it looks the same. Which approach is this?<\/p>", "options": [{"k": "A", "t": "The biological species concept"}, {"k": "B", "t": "The phylogenetic species concept"}, {"k": "C", "t": "The morphological species concept"}, {"k": "D", "t": "The principle of parsimony"}], "answer": "<p><strong>C.<\/strong> The morphological concept holds that what looks different is different: simple, very practical, and developed before Darwin. Its working tool was the <strong>type specimen<\/strong>, the physical specimen kept in a museum that anchors a name. Specimens were checked against it, and if it looked the same, it was the same species. Nothing here tests interbreeding (A) or shared derived traits and ancestry (B).<\/p>", "note": "", "key": ["C"], "tf": false}, {"id": "P4", "title": "Where the biological species concept breaks down", "part": 0, "source": "", "stem": "<p>The biological species concept is hardest to apply to which organisms?<\/p>", "options": [{"k": "A", "t": "Species that were first described from a type specimen"}, {"k": "B", "t": "Large mammals that live as several separate populations"}, {"k": "C", "t": "Organisms whose DNA has already been sequenced"}, {"k": "D", "t": "Organisms that reproduce without sex, for example by cloning or parthenogenesis"}], "answer": "<p><strong>D.<\/strong> The biological species concept defines species by reproductive isolation: who can breed with whom. If an organism can clone itself or reproduce by parthenogenesis (develop offspring from an unfertilized egg), the concept breaks down. That gap is one reason the morphological concept stuck around for a long time.<\/p>", "note": "", "key": ["D"], "tf": false}, {"id": "P5", "title": "Hybrids that can't reproduce", "part": 0, "source": "", "stem": "<p>Two populations mate in captivity and produce healthy hybrid offspring, but the hybrids cannot have offspring of their own. Under the biological species concept, the two parent populations are:<\/p>", "options": [{"k": "A", "t": "The same species, because they were able to mate"}, {"k": "B", "t": "Separate species, because the concept requires offspring that can go on to have offspring of their own"}, {"k": "C", "t": "Impossible to classify without a type specimen"}, {"k": "D", "t": "The same species as the hybrid, because the hybrid looks like both parents"}], "answer": "<p><strong>B.<\/strong> The test is not just mating: two members of a species must be able to breed and produce offspring that can go on to have offspring of their own. A cross between normally separate species (like a zebra hybrid) doesn't make them one species. A is the tempting half-truth: being able to mate is not enough.<\/p>", "note": "", "key": ["B"], "tf": false}, {"id": "P6", "title": "The phylogenetic species concept", "part": 0, "source": "", "stem": "<p>Which description matches the phylogenetic species concept?<\/p>", "options": [{"k": "A", "t": "Species are populations that share a combination of derived traits, form monophyletic groups, and have been evolutionarily independent long enough for diagnostic traits to appear"}, {"k": "B", "t": "Species are groups whose members can interbreed and produce offspring that can themselves reproduce"}, {"k": "C", "t": "Species are whatever looks different, checked against a type specimen"}, {"k": "D", "t": "Species are populations whose DNA is at least 99.8% identical"}], "answer": "<p><strong>A.<\/strong> All three parts belong to the definition, and \"monophyletic\" is the term to be sure you can explain. B is the biological concept and C the morphological one. D sounds precise, but there is <strong>no<\/strong> universal DNA cut-off (see P7).<\/p>", "note": "", "key": ["A"], "tf": false}, {"id": "P7", "title": "A universal cut-off?", "part": 0, "source": "", "stem": "<p>True or false: biologists use a universal DNA-similarity threshold (for example, 99.8% identical) to decide when two populations count as separate species.<\/p>", "options": [{"k": "A", "t": "True"}, {"k": "B", "t": "False"}], "answer": "<p><strong>B. False.<\/strong> There are some benchmarks, but the number differs enormously between, say, bacteria and the great apes. That is part of why \"what is a species\" is still a contested definition.<\/p>", "note": "", "key": ["B"], "tf": true}, {"id": "P8", "title": "Splitting a population", "part": 0, "source": "", "stem": "<p>True or false: if one population is split in two and no mating can occur between the halves, different mutations accumulate in each, and the genetic difference between them grows with the time since they were isolated.<\/p>", "options": [{"k": "A", "t": "True"}, {"k": "B", "t": "False"}], "answer": "<p><strong>A. True.<\/strong> The extent of genetic divergence is a function of time since isolation. With enough difference, the two populations may come to be treated as two species. That splitting over time is what a phylogenetic tree draws.<\/p>", "note": "", "key": ["A"], "tf": true}, {"id": "P9", "title": "Are trees permanent?", "part": 0, "source": "", "stem": "<p>True or false: because a phylogenetic tree is built from extensive data, once it is published it is a final record and is not redrawn.<\/p>", "options": [{"k": "A", "t": "True"}, {"k": "B", "t": "False"}], "answer": "<p><strong>B. False.<\/strong> A tree is a <strong>hypothesis<\/strong>, a data-driven explanation, and it may have to change when new data arrive. Compare a textbook from today with one from ten years ago: some groups' phylogenies have changed a lot, because the amount of DNA sequence data grows every year.<\/p>", "note": "", "key": ["B"], "tf": true}, {"id": "P10", "title": "Reptiles without birds", "part": 0, "source": "", "stem": "<p>Tree: (Mammals, ((Lizards, Snakes), (Crocodilians, Birds)))<\/p><p>Which grouping is <strong>paraphyletic<\/strong>?<\/p>", "options": [{"k": "A", "t": "Lizards + Snakes"}, {"k": "B", "t": "Crocodilians + Birds"}, {"k": "C", "t": "Lizards + Snakes + Crocodilians"}, {"k": "D", "t": "Lizards + Snakes + Crocodilians + Birds"}], "answer": "<p><strong>C.<\/strong> This is the traditional \"reptiles\" grouping. Its common ancestor (the node joining the lizard/snake pair with the crocodilian/bird pair) also gave rise to birds, which C leaves out, so it has some but not all of that ancestor's descendants. A, B and D each contain a node and <strong>all<\/strong> of its descendants, so they are monophyletic. Talking about \"reptiles\" while excluding birds loses much of the story.<\/p>", "note": "", "key": ["C"], "tf": false}, {"id": "P11", "title": "Same tree or not?", "part": 0, "source": "", "stem": "<p>Reference tree: (P, (Q, (R, S)))<\/p><p>Which tree shows <strong>different<\/strong> relationships from the reference?<\/p>", "options": [{"k": "A", "t": "(P, (Q, (S, R)))"}, {"k": "B", "t": "(((R, S), Q), P)"}, {"k": "C", "t": "((Q, (S, R)), P)"}, {"k": "D", "t": "(P, (R, (Q, S)))"}], "answer": "<p><strong>D.<\/strong> Only the branching pattern matters. Swapping the two branches at a node (R/S, or putting P on the other side) doesn't change who shares which node, so A, B and C are all the same tree drawn differently. In D, Q and S have become sister taxa, but in the reference S's sister is R. The same holds for any pair of trees that list the tips in opposite orders but show the same relationships.<\/p>", "note": "", "key": ["D"], "tf": false}, {"id": "P12", "title": "Inside the vertebrate tree", "part": 0, "source": "", "stem": "<p>Tree: (Fish, (Amphibians, ((Mammal-like reptiles, Mammals), ((Crocodiles, (Non-avian dinosaurs, Birds)), (Tuatara, (Snakes, Lizards))))))<\/p><p>Which statement is supported by this tree?<\/p>", "options": [{"k": "A", "t": "Crocodiles share a more recent common ancestor with birds than with lizards"}, {"k": "B", "t": "Lizards share a more recent common ancestor with tuatara than with snakes"}, {"k": "C", "t": "Birds fall outside the dinosaur clade"}, {"k": "D", "t": "Mammals are more closely related to crocodiles than to mammal-like reptiles"}], "answer": "<p><strong>A.<\/strong> Crocodiles and birds meet at the node they share with the non-avian dinosaurs. Crocodiles and lizards only meet further down, at the node that also takes in tuatara and snakes. The key reading is that crocodiles are more closely related to birds than to lizards or snakes. B is backwards: snakes and lizards are the sister pair. C: birds sit <em>inside<\/em> the dinosaurs, sister to the non-avian dinosaurs. D: mammals' sister group is the mammal-like reptiles.<\/p>", "note": "", "key": ["A"], "tf": false}, {"id": "P13", "title": "Our closest relatives", "part": 0, "source": "", "stem": "<p>Tree: (Gibbon, (Orangutan, (Gorilla, (Human, (Chimpanzee, Bonobo)))))<\/p><p>Which taxon or taxa are humans' closest relatives on this tree?<\/p>", "options": [{"k": "A", "t": "Gorilla"}, {"k": "B", "t": "Chimpanzee only; the bonobo is more distant"}, {"k": "C", "t": "Chimpanzee and bonobo, equally"}, {"k": "D", "t": "Orangutan"}], "answer": "<p><strong>C.<\/strong> Humans join the chimpanzee + bonobo pair at a single node, so both are equally related to us. Chimps and bonobos are each other's sister taxa. Humans are the sister group of that pair, not of either one alone. B is the trap: the order the tips are drawn in doesn't make one of the two closer.<\/p>", "note": "", "key": ["C"], "tf": false}, {"id": "P14", "title": "Fixing \"fish\"", "part": 0, "source": "", "stem": "<p>Tree: ((Hagfish, Lampreys), (Sharks and rays, (Ray-finned fish, (Coelacanths, (Lungfish, Tetrapods)))))<\/p><p>The traditional group \"fish\" (every tip except Tetrapods) is paraphyletic. Which change would make the group <strong>monophyletic<\/strong>?<\/p>", "options": [{"k": "A", "t": "Remove hagfish and lampreys"}, {"k": "B", "t": "Add the tetrapods"}, {"k": "C", "t": "Remove the lungfish"}, {"k": "D", "t": "Remove the sharks and rays"}], "answer": "<p><strong>B.<\/strong> \"Fish\" has the common ancestor of every tip on this tree, but snips off one branch of its descendants, the tetrapods. Putting them back gives that ancestor plus <strong>all<\/strong> of its descendants. Each removal in A, C and D still leaves a group whose common ancestor also gave rise to the tetrapods, so the group is still not monophyletic.<\/p>", "note": "", "key": ["B"], "tf": false}, {"id": "P15", "title": "\"Finned swimmers\"", "part": 0, "source": "", "stem": "<p>A student groups sharks and dolphins together as \"finned swimmers\" because both have a streamlined body and fins. How is this group best described?<\/p>", "options": [{"k": "A", "t": "Monophyletic, because the fins are homologous"}, {"k": "B", "t": "Paraphyletic, because sharks and dolphins inherited their streamlined body shape from a shared ancestor"}, {"k": "C", "t": "A clade defined by a synapomorphy"}, {"k": "D", "t": "Polyphyletic, because it is built on similarities that evolved independently"}], "answer": "<p><strong>D.<\/strong> Sharks and dolphins are very distantly related. They solved the same problem of moving through water in similar ways, but from different ancestors, so the traits are analogous, not homologous. Grouping taxa by homoplasy is what makes a group polyphyletic, the same mistake as \"winged tetrapods\" (birds + bats). B's premise is false: the body shape was <em>not<\/em> inherited from a shared ancestor.<\/p>", "note": "", "key": ["D"], "tf": false}, {"id": "P16", "title": "Wings and forelimbs", "part": 0, "source": "", "stem": "<p>How are a bat's wing and a bird's wing best described?<\/p>", "options": [{"k": "A", "t": "Homologous as wings and homologous as forelimbs"}, {"k": "B", "t": "Analogous as wings, but homologous as forelimbs"}, {"k": "C", "t": "Analogous both as wings and as forelimbs"}, {"k": "D", "t": "Homologous as wings, but analogous as forelimbs"}], "answer": "<p><strong>B.<\/strong> Bird and bat wings are analogous, but as forelimbs they are homologous. The bones (humerus, radius, ulna and so on) come from the shared tetrapod ancestor. Turning that forelimb into a wing for flight happened separately in the two lineages.<\/p>", "note": "", "key": ["B"], "tf": false}, {"id": "P17", "title": "Partial homology?", "part": 0, "source": "", "stem": "<p>True or false: homology is binary. A character either is or is not homologous; there is no such thing as partial homology.<\/p>", "options": [{"k": "A", "t": "True"}, {"k": "B", "t": "False"}], "answer": "<p><strong>A. True.<\/strong> There is no gray area: homology is a binary choice. P16 shows it: the bat and bird <em>wing<\/em> is analogous, the <em>forelimb<\/em> is homologous. Each of those characters is fully one or the other; neither is \"kind of\" homologous.<\/p>", "note": "", "key": ["A"], "tf": true}, {"id": "P18", "title": "Spot the homoplasy", "part": 0, "source": "", "stem": "<p>Which pair of similar traits is a <strong>homoplasy<\/strong>?<\/p>", "options": [{"k": "A", "t": "The amniotic egg of turtles and of the early ancestors of mammals"}, {"k": "B", "t": "The same set of forelimb bones in a horse and a human"}, {"k": "C", "t": "The coiled shell of a snail and the similar coiled case some insects build"}, {"k": "D", "t": "Hair in mice and in bats"}], "answer": "<p><strong>C.<\/strong> By definition, a homoplasy is a similarity resulting from independent evolution, not common ancestry. A coiled shell keeps an animal compact, and distant lineages arrived at it separately. A, B and D are homologies: the amniotic egg evolved once in the sauropsid + mammal ancestor, the forelimb bones come from the tetrapod ancestor, and hair is a mammal synapomorphy.<\/p>", "note": "", "key": ["C"], "tf": false}, {"id": "P19", "title": "Same feature, different starting point", "part": 0, "source": "", "stem": "<p>Independent evolution of the same feature from <strong>different<\/strong> ancestral conditions is the definition of:<\/p>", "options": [{"k": "A", "t": "Convergent evolution"}, {"k": "B", "t": "Parallel evolution"}, {"k": "C", "t": "Secondary loss"}, {"k": "D", "t": "Synapomorphy"}], "answer": "<p><strong>A.<\/strong> The three terms are distinct. <strong>Parallel<\/strong> evolution produces the same feature from the <strong>same<\/strong> ancestral condition. <strong>Convergent<\/strong> evolution produces it from <strong>different<\/strong> ancestral conditions. <strong>Secondary loss<\/strong> is a reversion to the ancestral condition. All three are homoplasy, so D is wrong: a synapomorphy is inherited from a shared ancestor. (Parallel and convergent evolution are often blurred in casual use, and the coiled shell is sometimes cited under both; go by the definitions here: \"same\" vs \"different\" ancestral condition.)<\/p>", "note": "", "key": ["A"], "tf": false}, {"id": "P20", "title": "Mammals that don't lay eggs", "part": 0, "source": "", "stem": "<p>The amniotic egg evolved in the common ancestor of sauropsids and mammals, but among living mammals only the platypus and echidna still lay eggs. How is the <strong>loss<\/strong> of egg-laying in the other mammals best described?<\/p>", "options": [{"k": "A", "t": "A synapomorphy shared by all amniotes"}, {"k": "B", "t": "Parallel evolution"}, {"k": "C", "t": "An autapomorphy of the platypus"}, {"k": "D", "t": "Secondary loss, a reversion to the ancestral condition and a kind of homoplasy"}], "answer": "<p><strong>D.<\/strong> A long-lost ancestor laid amniotic eggs, but over time that character was lost, and losing a character is secondary loss, one of the three routes to homoplasy. A describes the <em>egg<\/em>, not its loss. C reverses the logic: the platypus kept the ancestral trait, so egg-laying is nothing new or unique to it.<\/p>", "note": "", "key": ["D"], "tf": false}, {"id": "P21", "title": "Building a tree from wings", "part": 0, "source": "", "stem": "<p>The true tree is ((Bat, Mouse), (Bird, Crocodile)). If a biologist used \"has wings\" as a character to build a tree of these four animals, the result would most likely:<\/p>", "options": [{"k": "A", "t": "Correctly place bats with mice"}, {"k": "B", "t": "Correctly place birds with crocodiles"}, {"k": "C", "t": "Wrongly group birds with bats, implying a winged common ancestor that never existed"}, {"k": "D", "t": "Show wings as the ancestral state of all four"}], "answer": "<p><strong>C.<\/strong> Wings evolved separately on the bat branch and on the bird branch. Treating them as shared would put two unrelated tips together and produce a polyphyletic \"winged\" group. That's why homologies should be included and analogies excluded: analogies are a trap evolutionary biologists must watch for.<\/p>", "note": "", "key": ["C"], "tf": false}, {"id": "P22", "title": "Which character unites lungfish with tetrapods?", "part": 0, "source": "", "stem": "<p>Tree: ((Hagfish, Lampreys), (Sharks and rays, (Ray-finned fish, (Coelacanths, (Lungfish, Tetrapods)))))<\/p><p>Which character is a synapomorphy of <strong>lungfish + tetrapods<\/strong>, not shared with coelacanths?<\/p>", "options": [{"k": "A", "t": "Hinged jaw"}, {"k": "B", "t": "Lobed fins"}, {"k": "C", "t": "Amniotic egg"}, {"k": "D", "t": "Lungs"}], "answer": "<p><strong>D.<\/strong> Lungfish and tetrapods share lungs. The hinged jaw arose much deeper, in the sharks + bony fish + tetrapods ancestor. Lobed fins unite coelacanths and lungfish, so they don't exclude coelacanths. The amniotic egg arose higher up, at the sauropsid + mammal node, so lungfish don't have it.<\/p>", "note": "", "key": ["D"], "tf": false}, {"id": "P23", "title": "The hinged jaw, seen from inside the mammals", "part": 0, "source": "", "stem": "<p>When comparing only mammals with each other (pigs, primates, marsupials), the hinged jaw is:<\/p>", "options": [{"k": "A", "t": "A synapomorphy of mammals"}, {"k": "B", "t": "A plesiomorphy"}, {"k": "C", "t": "An autapomorphy"}, {"k": "D", "t": "A homoplasy"}], "answer": "<p><strong>B.<\/strong> A plesiomorphy is the ancestral character state. Every mammal inherited the hinged jaw from an ancestor far below the mammal node, so it can't sort mammals from each other. The same jaw <em>is<\/em> a synapomorphy of the bigger group (sharks + bony fish + tetrapods). The label depends on which node you're looking at. The mammal synapomorphy is hair and milk glands.<\/p>", "note": "", "key": ["B"], "tf": false}, {"id": "P24", "title": "A change in just one species", "part": 0, "source": "", "stem": "<p>In the aligned rodent sequences, one T→G change appears in the mouse only, and in no other sequence. This change is:<\/p>", "options": [{"k": "A", "t": "An autapomorphy, which is phylogenetically uninformative because it doesn't help group taxa"}, {"k": "B", "t": "A synapomorphy that defines mouse + rat"}, {"k": "C", "t": "A plesiomorphy shared with the rabbit"}, {"k": "D", "t": "A homoplasy shared with the guinea pig"}], "answer": "<p><strong>A.<\/strong> An autapomorphy is a uniquely derived character state found in one taxon. Changes unique to one species are phylogenetically uninformative because they don't help group taxa. Only <em>shared<\/em> derived states (synapomorphies) can join tips together.<\/p>", "note": "", "key": ["A"], "tf": false}, {"id": "P25", "title": "The A→G change", "part": 0, "source": "", "stem": "<p>Rabbit is the outgroup. At one position the rabbit has A, while the mouse, rat and guinea pig all have G. What is the G at this position?<\/p>", "options": [{"k": "A", "t": "A plesiomorphy, since the rabbit sequence is the ancestral one"}, {"k": "B", "t": "An autapomorphy of the guinea pig"}, {"k": "C", "t": "A synapomorphy that defines mouse + rat + guinea pig as a group"}, {"k": "D", "t": "Evidence that the rabbit is the mouse's closest relative"}], "answer": "<p><strong>C.<\/strong> The outgroup shows the ancestral state (A). The derived G is shared by all three rodents because it arose once in their common ancestor: a shared derived character that defines that group. A is half right: the rabbit's <strong>A<\/strong> is the plesiomorphy, but the question asks about the G. The C→T and C→A changes then define mouse + rat as sister taxa.<\/p>", "note": "", "key": ["C"], "tf": false}, {"id": "P26", "title": "What a molecular clock is", "part": 0, "source": "", "stem": "<p>Which statement best describes a molecular clock?<\/p>", "options": [{"k": "A", "t": "All genes mutate at the same rate, so any gene gives the same divergence date"}, {"k": "B", "t": "A fossil-dated timeline that replaces DNA data when building trees"}, {"k": "C", "t": "A count of the morphological differences between two species"}, {"k": "D", "t": "A gene that accumulates changes at a regular rate, so the number of differences between two species estimates how long ago they diverged"}], "answer": "<p><strong>D.<\/strong> Genes that accumulate mutations at a regular rate can be used as a molecular clock. Count the differences in that gene and you can estimate the time since divergence; fossil evidence helps check and calibrate the timeline. A is the trap: each gene ticks steadily but at <strong>its own<\/strong> rate (fibrinopeptide fast, cytochrome <em>c<\/em> slow, histone almost flat).<\/p>", "note": "", "key": ["D"], "tf": false}, {"id": "P27", "title": "Why the histone gene barely changes", "part": 0, "source": "", "stem": "<p>The histone gene sequence is almost identical across organisms whose lineages diverged over a billion years ago. What is the best explanation?<\/p>", "options": [{"k": "A", "t": "Almost any change makes the gene non-functional, so organisms carrying a change don't survive; the gene is highly conserved"}, {"k": "B", "t": "Mutations never occur in the histone gene"}, {"k": "C", "t": "These organisms actually diverged only recently"}, {"k": "D", "t": "The histone gene is the fastest-ticking gene on the graph"}], "answer": "<p><strong>A.<\/strong> With histone, almost any mutation is lethal, so changes aren't passed on. That makes it a two-step idea: a mutation has to occur, and the organism then has to survive with it. That's why B is wrong: mutations happen, but they aren't kept. Genes that can tolerate change (variable genes, such as fibrinopeptide, the steepest line on the graph) pile up differences quickly. Conserved genes like histone barely change.<\/p>", "note": "", "key": ["A"], "tf": false}, {"id": "P28", "title": "The most parsimonious tree", "part": 0, "source": "", "stem": "<div class=\"shared\"><p>Use this character matrix for P28 and P29. 0 = ancestral state, 1 = derived state; the outgroup has the ancestral state for every character.<\/p><div class=\"tbl\"><table><thead><tr><th>Taxon<\/th><th>Char 1<\/th><th>Char 2<\/th><th>Char 3<\/th><th>Char 4<\/th><th>Char 5<\/th><\/tr><\/thead><tbody><tr><td>Outgroup<\/td><td>0<\/td><td>0<\/td><td>0<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>W<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>0<\/td><td>1<\/td><\/tr><tr><td>X<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>Y<\/td><td>1<\/td><td>0<\/td><td>1<\/td><td>1<\/td><td>0<\/td><\/tr><tr><td>Z<\/td><td>1<\/td><td>0<\/td><td>1<\/td><td>1<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div><\/div><p>Which tree is the <strong>most parsimonious<\/strong> for this matrix?<\/p>", "options": [{"k": "A", "t": "(Outgroup, ((W, Z), (X, Y)))"}, {"k": "B", "t": "(Outgroup, (W, (X, (Y, Z))))"}, {"k": "C", "t": "(Outgroup, ((W, X), (Y, Z)))"}, {"k": "D", "t": "(Outgroup, ((W, Y), (X, Z)))"}], "answer": "<p><strong>C.<\/strong> Shortcut: look for pairs that share a 1. W + X share character 2; Y + Z share characters 3 and 4. Only tree C keeps both pairs together, so each of those characters costs just one change there. Character 5 (W and Z) fits no tree, so it costs two everywhere.<\/p><div class=\"tbl\"><table><thead><tr><th>Character<\/th><th>Shared by<\/th><th>Tree B<\/th><th>Tree C<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>W X Y Z<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>2<\/td><td>W, X<\/td><td>2 (B splits W from X)<\/td><td>1<\/td><\/tr><tr><td>3<\/td><td>Y, Z<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>4<\/td><td>Y, Z<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>5<\/td><td>W, Z<\/td><td>2<\/td><td>2<\/td><\/tr><tr><td>Total<\/td><td><\/td><td>7<\/td><td><strong>6<\/strong><\/td><\/tr><\/tbody><\/table><\/div><p>In words: count the changes on each tree. On C, characters 1–4 each need one change: char 1 on the branch leading to all four ingroup taxa, char 2 on the branch to W + X, and chars 3 and 4 on the branch to Y + Z. Character 5 needs two, so the total is <strong>6<\/strong>. A needs 8, B needs 7 and D needs 9. Parsimony picks the tree with the fewest total evolutionary changes. A is the trap: it rewards character 5 and pays for that with characters 2, 3 and 4.<\/p>", "note": "", "key": ["C"], "tf": false}, {"id": "P29", "title": "Character 5", "part": 0, "source": "", "stem": "<div class=\"shared\"><p>Use this character matrix for P28 and P29. 0 = ancestral state, 1 = derived state; the outgroup has the ancestral state for every character.<\/p><div class=\"tbl\"><table><thead><tr><th>Taxon<\/th><th>Char 1<\/th><th>Char 2<\/th><th>Char 3<\/th><th>Char 4<\/th><th>Char 5<\/th><\/tr><\/thead><tbody><tr><td>Outgroup<\/td><td>0<\/td><td>0<\/td><td>0<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>W<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>0<\/td><td>1<\/td><\/tr><tr><td>X<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>Y<\/td><td>1<\/td><td>0<\/td><td>1<\/td><td>1<\/td><td>0<\/td><\/tr><tr><td>Z<\/td><td>1<\/td><td>0<\/td><td>1<\/td><td>1<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div><\/div><p>On the most parsimonious tree from P28, how is character 5 (present in W and Z only) best described?<\/p>", "options": [{"k": "A", "t": "A synapomorphy of W + Z"}, {"k": "B", "t": "A homoplasy: it must have arisen twice independently, adding an extra step"}, {"k": "C", "t": "A plesiomorphy of the ingroup"}, {"k": "D", "t": "An autapomorphy of W"}], "answer": "<p><strong>B.<\/strong> On ((W, X), (Y, Z)), W and Z sit in different pairs, and the node joining them didn't have character 5. So it had to evolve separately on the W branch and on the Z branch, two steps. This is the classic homoplasy pattern: derived tips at opposite ends of the tree with ancestral nodes in between. It isn't a synapomorphy on this tree (A), and it's found in two taxa, not one (D).<\/p>", "note": "", "key": ["B"], "tf": false}, {"id": "P30", "title": "Counting steps for one character", "part": 0, "source": "", "stem": "<p>Tree: (O, (P, (Q, R))). O is the outgroup and branches off first, then P; Q and R are each other's closest relatives.<\/p><p>One character (a feature, for example \"has wings\") is <strong>present (1) in P and R<\/strong> and <strong>absent (0) in O and Q<\/strong>. Absent is the ancestral state.<\/p><p>A <strong>change<\/strong> is one evolutionary event on a branch of the tree: the feature appearing (0 → 1) or being lost (1 → 0). What is the <strong>fewest<\/strong> number of changes that can produce this pattern on this tree?<\/p>", "options": [{"k": "A", "t": "1"}, {"k": "B", "t": "2"}, {"k": "C", "t": "3"}, {"k": "D", "t": "4"}], "answer": "<p><strong>B.<\/strong> Read it with real animals: O = frog, P = bird, Q = human, R = bat, and the character is \"has wings\" (0 = no wings, 1 = wings). A <strong>change<\/strong> is one evolutionary event on the tree: wings appearing, or wings being lost. The question asks: what is the fewest number of such events that gives this pattern?<\/p><ul><li><strong>One is impossible.<\/strong> Wings evolving once in the ancestor of bird + human + bat would give humans wings too.<\/li><li><strong>Two works, two ways:<\/strong> wings evolved separately in birds and in bats (convergence), or evolved once in that ancestor and were lost in humans (secondary loss).<\/li><\/ul><p>Rule of thumb: if the taxa sharing the 1 are not each other's closest relatives on the tree, one change can't do it. The extra change is homoplasy, like bird and bat wings.<\/p>", "note": "", "key": ["B"], "tf": false}, {"id": "E1", "title": "Why domains and not kingdoms", "part": 1, "source": "", "stem": "<p>Which statement best explains why biologists now group life into domains rather than kingdoms?<\/p>", "options": [{"k": "A", "t": "Kingdoms are too few categories to hold all of eukaryote diversity."}, {"k": "B", "t": "Domains are supported by scientific evidence; kingdom schemes are not, and different versions disagree with each other."}, {"k": "C", "t": "Domains were first proposed only after DNA sequencing of eukaryotes around 2000."}, {"k": "D", "t": "Kingdoms only apply to prokaryotes."}], "answer": "<p><strong>B.<\/strong> Domains are supported by scientific evidence and kingdoms are not; the classic five-kingdom and six-kingdom schemes contradict each other. C is the trap: domains date from the 1980s; the ~2000 date is the reorganization of eukaryotes into supergroups.<\/p>", "note": "", "key": ["B"], "tf": false}, {"id": "E2", "title": "Ranks from most to least inclusive", "part": 1, "source": "", "stem": "<p>Which sequence runs from the MOST inclusive group to the LEAST inclusive?<\/p>", "options": [{"k": "A", "t": "Supergroup → Domain → Phylum → Species"}, {"k": "B", "t": "Domain → Phylum → Supergroup → Species"}, {"k": "C", "t": "Domain → Supergroup → Phylum → Species"}, {"k": "D", "t": "Kingdom → Domain → Supergroup → Phylum"}], "answer": "<p><strong>C.<\/strong> Above the phylum is the supergroup, and above the supergroup is the domain. Supergroups collect phyla into one bin. D adds kingdoms, which this scheme doesn't use at all.<\/p>", "note": "", "key": ["C"], "tf": false}, {"id": "E3", "title": "Supergroups: which is FALSE?", "part": 1, "source": "", "stem": "<p>Which statement about eukaryote supergroups is FALSE?<\/p>", "options": [{"k": "A", "t": "The number of supergroups recognized has stayed the same since they were first proposed."}, {"k": "B", "t": "Each supergroup is intended to be monophyletic."}, {"k": "C", "t": "Supergroups are supported by molecular data and ultrastructural details."}, {"k": "D", "t": "Each supergroup contains many phyla."}], "answer": "<p><strong>A.<\/strong> The number of supergroups has changed over 20+ years as new data arrived; it depends which paper or textbook you read, and a common scheme uses five. B, C and D are accurate statements about the supergroups.<\/p>", "note": "", "key": ["A"], "tf": false}, {"id": "E4", "title": "Where eukaryote diversity really lies", "part": 1, "source": "", "stem": "<p>True or false: most of the diversity on the new tree of eukaryotes is made up of single-celled organisms, not animals, plants and fungi.<\/p>", "options": [{"k": "A", "t": "True"}, {"k": "B", "t": "False"}], "answer": "<p><strong>A, true.<\/strong> Most eukaryotes are single-celled organisms, and they dominate eukaryotic diversity. The old picture (mostly animals, fungi, plants and a few single-celled things) is the one that is wrong.<\/p>", "note": "", "key": ["A"], "tf": true}, {"id": "E5", "title": "What SAR stands for", "part": 1, "source": "", "stem": "<p>The supergroup SAR is named for which three clades?<\/p>", "options": [{"k": "A", "t": "Sporozoans, Amoebae and Red algae"}, {"k": "B", "t": "Stramenopiles, Archaeplastids and Rhizarians"}, {"k": "C", "t": "Slime molds, Alveolates and Radiolarians"}, {"k": "D", "t": "Stramenopiles, Alveolates and Rhizarians"}], "answer": "<p><strong>D.<\/strong> SAR is an abbreviation worth knowing in full. B swaps in Archaeplastida, which is a separate supergroup (red algae, green algae and land plants).<\/p>", "note": "", "key": ["D"], "tf": false}, {"id": "E6", "title": "SAR's members are clades, not phyla", "part": 1, "source": "", "stem": "<p>True or false: the SAR supergroup is named for three phyla that consistently group together on eukaryote trees.<\/p>", "options": [{"k": "A", "t": "True"}, {"k": "B", "t": "False"}], "answer": "<p><strong>B, false.<\/strong> The three do consistently group together, but they are clades, not phyla, and the supergroup is SAR. Supergroups sit above phylum, and each of the three is a large clade (Stramenopiles alone holds diatoms, brown algae and oomycetes).<\/p>", "note": "", "key": ["B"], "tf": true}, {"id": "E7", "title": "Cryptists and haptists", "part": 1, "source": "", "stem": "<p>A common textbook tree shows cryptists and haptists, yet they are not among the five supergroups of the common scheme. Why?<\/p>", "options": [{"k": "A", "t": "They are prokaryotes that were mistakenly placed on the eukaryote tree."}, {"k": "B", "t": "When the tree was made there wasn't enough data to place them, so they were left unassigned."}, {"k": "C", "t": "They are extinct lineages known only from fossils."}, {"k": "D", "t": "They were merged into the Opisthokonta."}], "answer": "<p><strong>B.<\/strong> Early trees had little data on where these groups belonged (cryptists were named because they were cryptic). Newer trees slot them in differently, but a common scheme uses five supergroups.<\/p>", "note": "", "key": ["B"], "tf": false}, {"id": "E8", "title": "Diatoms and brown algae", "part": 1, "source": "", "stem": "<p>Diatoms and brown algae belong to which supergroup?<\/p>", "options": [{"k": "A", "t": "SAR"}, {"k": "B", "t": "Archaeplastida"}, {"k": "C", "t": "Excavata"}, {"k": "D", "t": "Amoebozoa"}], "answer": "<p><strong>A.<\/strong> Both are stramenopiles, inside SAR. B is the trap: \"algae\" in the name doesn't put them with the red and green algae.<\/p>", "note": "", "key": ["A"], "tf": false}, {"id": "E9", "title": "Red algae's closest company", "part": 1, "source": "", "stem": "<p>Red algae are in the same supergroup as which of the following?<\/p>", "options": [{"k": "A", "t": "Brown algae"}, {"k": "B", "t": "Fungi"}, {"k": "C", "t": "Green algae and land plants"}, {"k": "D", "t": "Diatoms"}], "answer": "<p><strong>C.<\/strong> Archaeplastida includes the green algae and land plants, the red algae, and some smaller groups. Brown algae and diatoms are in SAR; fungi are opisthokonts with the animals.<\/p>", "note": "", "key": ["C"], "tf": false}, {"id": "E10", "title": "Animals and their supergroup-mates", "part": 1, "source": "", "stem": "<p>Which pair of groups are BOTH in the Opisthokonta?<\/p>", "options": [{"k": "A", "t": "Animals and green algae"}, {"k": "B", "t": "Fungi and brown algae"}, {"k": "C", "t": "Fungi and red algae"}, {"k": "D", "t": "Animals and fungi"}], "answer": "<p><strong>D.<\/strong> Animals sit in the opisthokonts, and the fungi are there too, so fungi are close relatives of animals. (Choanoflagellates, the single-celled closest relatives of animals, are opisthokonts too.)<\/p>", "note": "", "key": ["D"], "tf": false}, {"id": "E11", "title": "What the tree says about \"algae\"", "part": 1, "source": "", "stem": "<p>On the eukaryote tree, photosynthetic lineages appear in Archaeplastida, in SAR (e.g. diatoms, brown algae) and among the Excavata. What does this tell you about the group \"algae\"?<\/p>", "options": [{"k": "A", "t": "Algae form a single monophyletic supergroup."}, {"k": "B", "t": "All algae are members of Archaeplastida."}, {"k": "C", "t": "\"Algae\" is not one clade: photosynthetic eukaryotes are scattered across several supergroups."}, {"k": "D", "t": "Algae are prokaryotes that live inside eukaryote cells."}], "answer": "<p><strong>C.<\/strong> Photosynthetic eukaryotes from several supergroups all get called algae, so \"algae\" is a messy, mixed grouping. Calling something an alga says nothing about which supergroup it belongs to.<\/p>", "note": "", "key": ["C"], "tf": false}, {"id": "E12", "title": "Not a eukaryote feature", "part": 1, "source": "", "stem": "<p>Which of the following is NOT true of eukaryotes?<\/p>", "options": [{"k": "A", "t": "They have a membrane-bound nucleus and other organelles."}, {"k": "B", "t": "They are more closely related to each other than to bacteria or archaea."}, {"k": "C", "t": "They are all multicellular."}, {"k": "D", "t": "Many of them move, at least in some part of their life cycle."}], "answer": "<p><strong>C.<\/strong> Eukaryotes include both multicellular and unicellular forms, and single-celled forms dominate their diversity. The rest are true.<\/p>", "note": "", "key": ["C"], "tf": false}, {"id": "E13", "title": "Flagella versus cilia", "part": 1, "source": "", "stem": "<p>Which statement about eukaryotic flagella and cilia is TRUE?<\/p>", "options": [{"k": "A", "t": "Flagella are many and short; cilia are one or a few and long."}, {"k": "B", "t": "Cilia move with a propeller-like motion, pushing water parallel to their own axis."}, {"k": "C", "t": "Flagella push water parallel to the cell surface, like paddles on a boat."}, {"k": "D", "t": "Flagella are one or a few and long, and push water parallel to the flagellum's axis."}], "answer": "<p><strong>D.<\/strong> Flagella: few, long, propeller-like, water pushed along the flagellum's axis. Cilia: many, short, beat back and forth like paddles, water pushed parallel to the cell surface. A, B and C each swap a property between the two.<\/p>", "note": "", "key": ["D"], "tf": false}, {"id": "E14", "title": "Evidence that cilia and flagella are homologous", "part": 1, "source": "", "stem": "<p>The cilia lining the human trachea and the flagellum of a sperm cell are both undulipodia. What evidence shows they are homologous structures?<\/p>", "options": [{"k": "A", "t": "Both are used to move something through a fluid."}, {"k": "B", "t": "Under the electron microscope, their cross-sections show the same structure of microtubule bundles made of the same molecules."}, {"k": "C", "t": "Both are found only in animals."}, {"k": "D", "t": "Both are about the same length."}], "answer": "<p><strong>B.<\/strong> They are known to be homologous because cross sections under an electron microscope show the same structure built from the same types of molecules. A is a shared function, which alone could be analogy; D is false (cilia are short, flagella long). Undulipodium is just the umbrella term for eukaryotic flagella and cilia.<\/p>", "note": "", "key": ["B"], "tf": false}, {"id": "E15", "title": "Bacterial versus eukaryotic flagella", "part": 1, "source": "", "stem": "<p>True or false: eukaryotic flagella are homologous to bacterial flagella, since both are used for swimming.<\/p>", "options": [{"k": "A", "t": "True"}, {"k": "B", "t": "False"}], "answer": "<p><strong>B, false.<\/strong> Bacterial flagella have a completely different makeup and work in a completely different way. Same name and same job, different origin. Only eukaryotic flagella and cilia are homologous to each other.<\/p>", "note": "", "key": ["B"], "tf": true}, {"id": "E16", "title": "Which life cycle goes with which group", "part": 1, "source": "", "stem": "<p>Eukaryote life cycles can be grouped into three broad themes. Which pairing is correct?<\/p>", "options": [{"k": "A", "t": "Alternation of generations: animals"}, {"k": "B", "t": "Dikaryotic: fungi"}, {"k": "C", "t": "Mainly diploid, with direct or indirect development: plants and algae"}, {"k": "D", "t": "Dikaryotic: plants and algae"}], "answer": "<p><strong>B.<\/strong> The three themes: mainly diploid with direct/indirect development for animals; alternation of generations for eukaryotic algae and plants; dikaryotic for fungi (fungi are unusual here, as the later fungal questions show).<\/p>", "note": "", "key": ["B"], "tf": false}, {"id": "E17", "title": "Direct development", "part": 1, "source": "", "stem": "<p>Which of these animals is an example of DIRECT development?<\/p>", "options": [{"k": "A", "t": "A frog (egg → tadpole → frog)"}, {"k": "B", "t": "A moth (egg → caterpillar → pupa → adult)"}, {"k": "C", "t": "A grasshopper (egg → small wingless grasshopper → adult)"}, {"k": "D", "t": "A jellyfish (polyp stage → medusa)"}], "answer": "<p><strong>C.<\/strong> The grasshopper hatches looking like a small adult without wings. The frog, moth and jellyfish all have juveniles that don't look like the adult: indirect development.<\/p>", "note": "", "key": ["C"], "tf": false}, {"id": "E18", "title": "Why indirect life cycles pay off", "part": 1, "source": "", "stem": "<p>What is one advantage of an indirect life cycle, such as caterpillar to butterfly?<\/p>", "options": [{"k": "A", "t": "Juveniles can produce gametes earlier."}, {"k": "B", "t": "Juveniles and adults often live in different places or eat different things, so they compete less with each other."}, {"k": "C", "t": "Juveniles are diploid while adults are haploid."}, {"k": "D", "t": "It removes the need for meiosis."}], "answer": "<p><strong>B.<\/strong> With direct development, juveniles and adults often overlap and compete for food; with indirect development the stages feed on different things (an adult butterfly doesn't go back to chewing leaves). A is wrong: juveniles by definition are not sexually mature. C confuses development with ploidy: both stages are diploid.<\/p>", "note": "", "key": ["B"], "tf": false}, {"id": "E19", "title": "Oviparous and viviparous", "part": 1, "source": "", "stem": "<p>An animal whose young develop inside the mother and are born live is described as:<\/p>", "options": [{"k": "A", "t": "Oviparous"}, {"k": "B", "t": "Isogamous"}, {"k": "C", "t": "Viviparous"}, {"k": "D", "t": "Anisogamous"}], "answer": "<p><strong>C.<\/strong> Viviparity = live birth (<em>vivi-<\/em> = alive); oviparity = laying eggs (<em>ovi-<\/em> = egg). Iso-/anisogamy describe gametes, not birth.<\/p>", "note": "", "key": ["C"], "tf": false}, {"id": "E20", "title": "Where meiosis happens in an animal", "part": 1, "source": "", "stem": "<p>In a typical animal life cycle, meiosis:<\/p>", "options": [{"k": "A", "t": "Happens when the sperm and egg fuse, producing the zygote."}, {"k": "B", "t": "Makes the zygote grow into a multicellular body."}, {"k": "C", "t": "Produces haploid spores that grow into a new body."}, {"k": "D", "t": "Turns diploid reproductive cells into haploid gametes, the only haploid cells in the life cycle."}], "answer": "<p><strong>D.<\/strong> Meiosis halves (2n → 1n) and makes the gametes; fusion is the opposite step, doubling 1n + 1n → 2n zygote (A). Growth of the zygote into a body is by mitosis (B). Spores (C) belong to alternation of generations, not animals.<\/p>", "note": "", "key": ["D"], "tf": false}, {"id": "E21", "title": "Oogamy", "part": 1, "source": "", "stem": "<p>Oogamy is best described as:<\/p>", "options": [{"k": "A", "t": "A type of isogamy in which both gametes swim."}, {"k": "B", "t": "The fusion of two nuclei after the cells have fused."}, {"k": "C", "t": "A type of anisogamy in which a large non-moving egg fuses with a small motile sperm."}, {"k": "D", "t": "Reproduction without gametes."}], "answer": "<p><strong>C.<\/strong> Oogamy is anisogamy with sperm and eggs. B describes karyogamy.<\/p>", "note": "", "key": ["C"], "tf": false}, {"id": "E22", "title": "Gametes that differ only slightly", "part": 1, "source": "", "stem": "<p>An alga produces two kinds of gametes. Both swim, but one is slightly larger than the other; neither is an egg or a sperm. This alga is:<\/p>", "options": [{"k": "A", "t": "Anisogamous"}, {"k": "B", "t": "Isogamous"}, {"k": "C", "t": "Oogamous"}, {"k": "D", "t": "Viviparous"}], "answer": "<p><strong>A.<\/strong> The gametes are not the same, so it's anisogamy, but not oogamy, since there's no egg and sperm. For example, gametes that differ a little in size, perhaps one with two flagella and the other with four, are still not eggs and sperm.<\/p>", "note": "", "key": ["A"], "tf": false}, {"id": "E23", "title": "Anisogamy and eggs", "part": 1, "source": "", "stem": "<p>True or false: every anisogamous organism produces eggs and sperm.<\/p>", "options": [{"k": "A", "t": "True"}, {"k": "B", "t": "False"}], "answer": "<p><strong>B, false.<\/strong> Sperm and eggs are one type of anisogametes, but not all anisogametes are sperm and eggs. Oogamy is a subset of anisogamy.<\/p>", "note": "", "key": ["B"], "tf": true}, {"id": "E24", "title": "Two nuclei in one cell", "part": 1, "source": "", "stem": "<p>Two haploid cells fuse, and the resulting cell contains two separate haploid nuclei that have not yet merged. Which step has happened?<\/p>", "options": [{"k": "A", "t": "Plasmogamy, but not yet karyogamy"}, {"k": "B", "t": "Karyogamy, but not yet plasmogamy"}, {"k": "C", "t": "Meiosis"}, {"k": "D", "t": "Both plasmogamy and karyogamy"}], "answer": "<p><strong>A.<\/strong> Plasmogamy = cell fusion; karyogamy = nuclear fusion, which is what makes the cell 2n. In humans the two happen about 10 ms apart, but that isn't always the case (the \"dikaryotic\" fungi are where it matters). B is impossible: the nuclei can't fuse before the cells do.<\/p>", "note": "", "key": ["A"], "tf": false}, {"id": "E25", "title": "Meiosis take-home points: which is FALSE?", "part": 1, "source": "", "stem": "<p>Which statement about meiosis is FALSE?<\/p>", "options": [{"k": "A", "t": "One diploid cell typically gives rise to four haploid cells."}, {"k": "B", "t": "Each daughter cell has half the chromosome number of the parent cell."}, {"k": "C", "t": "The daughter cells are genetically identical to each other and to the parent."}, {"k": "D", "t": "Meiosis is so similar across eukaryotes that it probably evolved in their common ancestor."}], "answer": "<p><strong>C.<\/strong> Each daughter cell is genetically unique, and that's how meiosis produces new combinations in offspring. Genetically identical daughter cells (two diploid ones) are what mitosis produces.<\/p>", "note": "", "key": ["C"], "tf": false}, {"id": "E26", "title": "A haploid-dominant single-celled eukaryote", "part": 1, "source": "", "stem": "<p>A single-celled eukaryote spends most of its life as haploid cells that multiply by mitosis. In its life cycle, which cell is diploid?<\/p>", "options": [{"k": "A", "t": "Only the zygote, which may rest through winter and then undergo meiosis"}, {"k": "B", "t": "Every cell that is dividing by mitosis"}, {"k": "C", "t": "The gametes"}, {"k": "D", "t": "The four cells released in spring"}], "answer": "<p><strong>A.<\/strong> Two haploid cells fuse into a zygote, often a resting stage that overwinters; in spring it goes through a round of meiosis and gives four new individuals (D), which are haploid. In this type the mitotic divisions (B) happen on the haploid side.<\/p>", "note": "", "key": ["A"], "tf": false}, {"id": "E27", "title": "Where mitosis can happen", "part": 1, "source": "", "stem": "<p>True or false: in single-celled eukaryotes, mitosis can occur in haploid cells as well as in diploid cells.<\/p>", "options": [{"k": "A", "t": "True"}, {"k": "B", "t": "False"}], "answer": "<p><strong>A, true.<\/strong> Mitosis may occur in either haploid or diploid cells. Students who think \"mitosis = diploid body cells\" from the animal cycle get this wrong. Some single-celled eukaryotes multiply by mitosis in the diploid phase (like <em>Paramecium<\/em>), others in the haploid phase.<\/p>", "note": "", "key": ["A"], "tf": true}, {"id": "E28", "title": "How the gametophyte makes gametes", "part": 1, "source": "", "stem": "<p>In alternation of generations, the haploid gametophyte produces gametes by:<\/p>", "options": [{"k": "A", "t": "Meiosis"}, {"k": "B", "t": "Karyogamy"}, {"k": "C", "t": "Plasmogamy"}, {"k": "D", "t": "Mitosis"}], "answer": "<p><strong>D.<\/strong> The gametophyte is already 1n, so it can't halve again: There is no meiosis this time: these gametes are not formed by meiosis. A haploid body making more haploid cells is mitosis; B and C are fusion steps, not ways of making cells. Meiosis happens only in the sporophyte, where it makes spores. This is the key difference from animals, where meiosis makes the gametes.<\/p>", "note": "", "key": ["D"], "tf": false}, {"id": "E29", "title": "Reading a described life cycle", "part": 1, "source": "", "stem": "<p>An alga has a large diploid individual whose reproductive cells undergo meiosis. The cells released settle and grow, without fusing, into small haploid individuals. These later release cells that fuse in pairs to form a zygote. The large diploid individual and the cells that fuse in pairs are, respectively:<\/p>", "options": [{"k": "A", "t": "Gametophyte; spores"}, {"k": "B", "t": "Sporophyte; gametes"}, {"k": "C", "t": "Sporophyte; spores"}, {"k": "D", "t": "Gametophyte; gametes"}], "answer": "<p><strong>B.<\/strong> The 2n generation that does meiosis is the sporophyte; what it releases are spores, which grow without fusing. The haploid individuals are gametophytes, and the cells that fuse are gametes. C is the spore-vs-gamete trap: spores never fuse.<\/p>", "note": "", "key": ["B"], "tf": false}, {"id": "E30", "title": "Do spores fuse?", "part": 1, "source": "", "stem": "<p>True or false: a spore released by a sporophyte must fuse with another spore (or with a gamete) before it can grow into the next generation.<\/p>", "options": [{"k": "A", "t": "True"}, {"k": "B", "t": "False"}], "answer": "<p><strong>B, false.<\/strong> Spores haven't fused with anything; they simply start to develop into the next life stage, growing by mitosis into a gametophyte. Fusion is only for gametes, so haploid spores and diploid cells do not fuse together.<\/p>", "note": "", "key": ["B"], "tf": true}, {"id": "A1", "title": "Choanoflagellates", "part": 2, "source": "", "stem": "<p>Which statement about the choanoflagellates is TRUE?<\/p>", "options": [{"k": "A", "t": "They are the earliest-branching animal phylum, placed just before the sponges"}, {"k": "B", "t": "They are sponges that secondarily lost their tissues"}, {"k": "C", "t": "They are unicellular or colonial flagellates, the closest living relatives of animals, but they do not produce collagen"}, {"k": "D", "t": "They belong to the supergroup Archaeplastida, with the red and green algae"}], "answer": "<p><strong>C.<\/strong> On the tree they are the outgroup to the animals; and they do not produce collagen. A is the trap: their collared cell looks like a sponge choanocyte, but they are not animals.<\/p>", "note": "", "key": ["C"], "tf": false}, {"id": "A2", "title": "Is the extracellular matrix unique to animals?", "part": 2, "source": "", "stem": "<p>True or false: having an extracellular matrix is what separates animals from all other multicellular organisms.<\/p>", "options": [{"k": "A", "t": "True"}, {"k": "B", "t": "False"}], "answer": "<p><strong>B. False.<\/strong> Extracellular matrices are present in all multicellular organisms, including fungi and plants. What only animals have is <strong>collagen<\/strong> in that matrix.<\/p>", "note": "", "key": ["B"], "tf": true}, {"id": "A3", "title": "Where do tissues appear on the tree?", "part": 2, "source": "", "stem": "<p>A common animal tree reads: Choanoflagellates branch first, then Sponges, then Cnidarians and Bilaterians. The character \"Tissues\" is marked on the node that unites…<\/p>", "options": [{"k": "A", "t": "choanoflagellates and all animals"}, {"k": "B", "t": "sponges, cnidarians and bilaterians"}, {"k": "C", "t": "cnidarians and bilaterians"}, {"k": "D", "t": "the bilaterians only"}], "answer": "<p><strong>C.<\/strong> Tissues arise after the sponges branch off. Sponges are just an association of cells with no true tissues, while cnidarians have them. B is the node marked \"Multicellularity, gastrulation, collagen\".<\/p>", "note": "", "key": ["C"], "tf": false}, {"id": "A4", "title": "The four ECM molecules", "part": 2, "source": "", "stem": "<p>Which pairing of an extracellular-matrix molecule with its description is CORRECT?<\/p>", "options": [{"k": "A", "t": "Collagen: large branched molecules that resist compression and spring back after being squished"}, {"k": "B", "t": "Proteoglycans: long proteins forming a triple helix with high tensile strength"}, {"k": "C", "t": "Glycoproteins: the one ECM molecule found only in animals"}, {"k": "D", "t": "Integrin: the molecule that connects the extracellular matrix to the outside of the cells"}], "answer": "<p><strong>D.<\/strong> A describes glycoproteins, B describes collagen, and C is collagen's role: it is the animal synapomorphy. Proteoglycans form the viscous fluid of mucus and the ECM.<\/p>", "note": "", "key": ["D"], "tf": false}, {"id": "A5", "title": "Mesoglea versus the sponge matrix", "part": 2, "source": "", "stem": "<p>Which statement correctly compares the middle layer of a sponge with that of a cnidarian?<\/p>", "options": [{"k": "A", "t": "Both are cell-free jelly layers"}, {"k": "B", "t": "The sponge matrix is cell-free, while the cnidarian mesoglea holds the choanocytes"}, {"k": "C", "t": "The cnidarian mesoglea is a cell-free jelly, while the sponge's collagen-containing matrix has cells living in it"}, {"k": "D", "t": "Both are true tissues lined with epithelium"}], "answer": "<p><strong>C.<\/strong> There are no cells in the mesoglea layer; it is a water-filled jelly. In the sponge, cells hang around in the matrix (it supports the cells that make spicules). Choanocytes belong to sponges, not cnidarians, so B is wrong twice.<\/p>", "note": "", "key": ["C"], "tf": false}, {"id": "A6", "title": "Polyp and medusa", "part": 2, "source": "", "stem": "<p>Which statement about the two cnidarian body forms is TRUE?<\/p>", "options": [{"k": "A", "t": "The polyp is attached to a surface with its mouth and tentacles facing up; the medusa swims freely with its mouth facing down"}, {"k": "B", "t": "The medusa is attached to a surface; the polyp is the free-swimming jellyfish"}, {"k": "C", "t": "Only the medusa has cnidocytes; the polyp filters particles like a sponge"}, {"k": "D", "t": "Every cnidarian goes through both a polyp and a medusa stage"}], "answer": "<p><strong>A.<\/strong> Both forms catch prey with cnidocytes, so C is false. D is false: some cnidarians have only the polyp stage.<\/p>", "note": "", "key": ["A"], "tf": false}, {"id": "A7", "title": "What does NOT separate cnidarians from sponges?", "part": 2, "source": "", "stem": "<p>Which of the following is NOT a difference between cnidarians and sponges?<\/p>", "options": [{"k": "A", "t": "Cnidarians have an epithelial-lined gut; sponges do not"}, {"k": "B", "t": "Cnidarians produce collagen; sponges do not"}, {"k": "C", "t": "Cnidarians have a wider array of cell types, including stinging cells"}, {"k": "D", "t": "Cnidarians are generally predators; sponges feed on particles filtered from the water"}], "answer": "<p><strong>B.<\/strong> Collagen is the synapomorphy of <em>all<\/em> animals, from humans to beetles, jellyfish, worms and sponges. The sponge's matrix is partly collagen. The other three are standard differences between cnidarians and sponges.<\/p>", "note": "", "key": ["B"], "tf": false}, {"id": "A8", "title": "Are cnidarians triploblastic?", "part": 2, "source": "", "stem": "<p>True or false: like the bilaterians, cnidarians are triploblastic; the mesoglea is their third tissue layer, between the epidermis and the endodermis.<\/p>", "options": [{"k": "A", "t": "True"}, {"k": "B", "t": "False"}], "answer": "<p><strong>B. False.<\/strong> Cnidarians are <strong>diploblastic<\/strong>: two tissue layers (epidermis and endodermis). The mesoglea between them is a cell-free jelly, not a tissue. \"Triploblastic\" is marked at the Bilateria node.<\/p>", "note": "", "key": ["B"], "tf": true}, {"id": "A9", "title": "The blastopore", "part": 2, "source": "", "stem": "<p>In animal development, the blastopore is…<\/p>", "options": [{"k": "A", "t": "the pore through which water enters a sponge"}, {"k": "B", "t": "the single opening of the cnidarian gut, used as both mouth and anus"}, {"k": "C", "t": "the first opening that forms as the hollow ball of cells (blastula) pinches in to become the gastrula"}, {"k": "D", "t": "the second opening in development, which always becomes the mouth"}], "answer": "<p><strong>C.<\/strong> Zygote → blastula (hollow ball) → gastrula, and the blastopore is that first opening. Whether it becomes the mouth (protostomes) or the anus (deuterostomes) is what splits the Bilateria. D mixes these up: the blastopore is the <em>first<\/em> opening, not the second.<\/p>", "note": "", "key": ["C"], "tf": false}, {"id": "A10", "title": "Placing a new bilaterian", "part": 2, "source": "", "stem": "<p>A newly discovered bilaterian is found to develop its anus from the blastopore, with the mouth forming later. On the animal tree it would group with…<\/p>", "options": [{"k": "A", "t": "nematodes and arthropods"}, {"k": "B", "t": "annelids and molluscs"}, {"k": "C", "t": "sponges and cnidarians"}, {"k": "D", "t": "echinoderms and chordates"}], "answer": "<p><strong>D.<\/strong> Blastopore → anus, mouth second = deuterostome; the deuterostomes are the echinoderms and chordates. A and B are both protostome groups (Ecdysozoa and Lophotrochozoa), and C are not bilaterians.<\/p>", "note": "", "key": ["D"], "tf": false}, {"id": "A11", "title": "Sister group of the Bilateria", "part": 2, "source": "", "stem": "<p>On the animal tree, which group is the closest relative of the Bilateria?<\/p>", "options": [{"k": "A", "t": "Poriferans"}, {"k": "B", "t": "Cnidarians"}, {"k": "C", "t": "Choanoflagellates"}, {"k": "D", "t": "Deuterostomes"}], "answer": "<p><strong>B.<\/strong> Cnidarians branch off just before the bilaterians and share their most recent common ancestor (the node with tissues). Deuterostomes are <em>inside<\/em> Bilateria, so they can't be its sister group.<\/p>", "note": "", "key": ["B"], "tf": false}, {"id": "A12", "title": "What holds the Lophotrochozoa together?", "part": 2, "source": "", "stem": "<p>Which statement about the Lophotrochozoa is most accurate?<\/p>", "options": [{"k": "A", "t": "It is a paraphyletic grouping of all segmented worms"}, {"k": "B", "t": "It is defined by moulting an outer cuticle in order to grow"}, {"k": "C", "t": "It is a monophyletic clade united mainly by DNA evidence; some members have a lophophore and others a trochophore larva, but no single feature is shared by all"}, {"k": "D", "t": "It is a group of deuterostomes that includes the earthworms and sea stars"}], "answer": "<p><strong>C.<\/strong> This is a monophyletic clade supported by DNA evidence, but there is no clear synapomorphy for all of these animals. B describes the Ecdysozoa. (The trochophore is still often treated as one of the defining characters, so trochophore → Lophotrochozoa in a matching question.)<\/p>", "note": "", "key": ["C"], "tf": false}, {"id": "A13", "title": "What gives an earthworm its shape?", "part": 2, "source": "", "stem": "<p>An earthworm has no bones and no hard exoskeleton, yet it keeps its body shape and can push through soil. What supports its body?<\/p>", "options": [{"k": "A", "t": "A hydrostatic skeleton: fluid-filled internal cavities, divided between segments by septa"}, {"k": "B", "t": "A chitin exoskeleton that it moults"}, {"k": "C", "t": "A notochord running from head to tail"}, {"k": "D", "t": "Mineralized spicules in its matrix"}], "answer": "<p><strong>A.<\/strong> They have fluid-filled cavities inside the body, which act as a hydrostatic skeleton. B is the arthropod (and Ecdysozoa) answer, C the chordate one, D the sponge one.<\/p>", "note": "", "key": ["A"], "tf": false}, {"id": "A14", "title": "Land animals without the larva", "part": 2, "source": "", "stem": "<p>Many land snails and earthworms hatch as small, adult-looking juveniles, with no trochophore larva. How does this fit their placement in the Lophotrochozoa?<\/p>", "options": [{"k": "A", "t": "It shows they were misplaced and actually belong in the Ecdysozoa"}, {"k": "B", "t": "Their ancestors had indirect development with a ciliated trochophore larva; land-dwelling forms have lost it and moved to direct development"}, {"k": "C", "t": "Their trochophore is the adult form, which never changes shape"}, {"k": "D", "t": "Only marine species are placed in the Lophotrochozoa; land species are placed elsewhere"}], "answer": "<p><strong>B.<\/strong> Many living mollusks and annelids have lost that larval form: those that live on land, for example, develop longer inside their eggs and have moved into direct development. But ancestrally, these animals have indirect development with a trochophore larva. Losing a trait doesn't remove a group from its clade.<\/p>", "note": "", "key": ["B"], "tf": false}, {"id": "A15", "title": "The mantle", "part": 2, "source": "", "stem": "<p>In molluscs, the mantle is…<\/p>", "options": [{"k": "A", "t": "a cell-free jelly layer between the epidermis and the endodermis"}, {"k": "B", "t": "a tentacle-lined organ used for filter feeding"}, {"k": "C", "t": "the shed outer covering left behind after mo
