ulting"}, {"k": "D", "t": "a layer of tissue that secretes the shell, present even in cephalopods that have no external shell"}], "answer": "<p><strong>D.<\/strong> One synapomorphy of the mollusks is a specialized layer of tissue, the mantle, that secretes the shell. In cephalopods it's present but isn't making an external shell. A is the cnidarian mesoglea (shell → mantle → mollusc; jelly → mesoglea → jellyfish). B is the lophophore, C an exuvia.<\/p>", "note": "", "key": ["D"], "tf": false}, {"id": "A16", "title": "Molluscs in every habitat", "part": 2, "source": "", "stem": "<p>Of the three main groups of molluscs, which is found in marine, freshwater AND terrestrial habitats?<\/p>", "options": [{"k": "A", "t": "Snails and slugs"}, {"k": "B", "t": "Clams, mussels and oysters"}, {"k": "C", "t": "Squids, octopuses and nautiluses"}, {"k": "D", "t": "None of them; all molluscs need seawater"}], "answer": "<p><strong>A.<\/strong> The gastropods are the only one of the three classes found in all three types of habitat. Bivalves live in salt water and fresh water but never on land; cephalopods are only marine.<\/p>", "note": "", "key": ["A"], "tf": false}, {"id": "A17", "title": "Cephalopod shells", "part": 2, "source": "", "stem": "<p>True or false: no living cephalopod has a shell of any kind.<\/p>", "options": [{"k": "A", "t": "True"}, {"k": "B", "t": "False"}], "answer": "<p><strong>B. False.<\/strong> Most living cephalopods have lost the <em>external<\/em> shell, but the nautilus still has one. Cuttlefish keep an internal shell (the cuttlebone), and squid a thin internal one; only octopuses have lost it entirely.<\/p>", "note": "", "key": ["B"], "tf": true}, {"id": "A18", "title": "Two kinds of \"roundworm\"", "part": 2, "source": "", "stem": "<p>Which statement correctly contrasts nematodes with annelids?<\/p>", "options": [{"k": "A", "t": "Nematodes are segmented and in the Lophotrochozoa; annelids are unsegmented and in the Ecdysozoa"}, {"k": "B", "t": "Both are segmented roundworms placed in the Ecdysozoa because they moult"}, {"k": "C", "t": "Nematodes are unsegmented and moult their outer covering (Ecdysozoa); annelids are segmented, with septa between segments (Lophotrochozoa)"}, {"k": "D", "t": "Both are deuterostomes, because both have a complete gut"}], "answer": "<p><strong>C.<\/strong> Nematodes are unsegmented roundworms and, like all Ecdysozoa, must shed their outer covering. Annelids are the segmented roundworms of the Lophotrochozoa. A swaps every label. D is wrong because having a complete gut doesn't make an animal a deuterostome; both are protostomes.<\/p>", "note": "", "key": ["C"], "tf": false}, {"id": "A19", "title": "Not a tardigrade", "part": 2, "source": "", "stem": "<p>Which of the following is NOT a feature of tardigrades?<\/p>", "options": [{"k": "A", "t": "An unsegmented body"}, {"k": "B", "t": "Four pairs of short, stubby, unjointed legs with claws"}, {"k": "C", "t": "A mouth with stylets for piercing prey or plant cells and sucking out the juices"}, {"k": "D", "t": "Jointed appendages and an exoskeleton containing chitin"}], "answer": "<p><strong>D.<\/strong> That's the arthropods. Tardigrades have stubby, unjointed legs and a <em>non-chitinous<\/em> cuticle, which they still moult, so they are Ecdysozoa.<\/p>", "note": "", "key": ["D"], "tf": false}, {"id": "A20", "title": "<em>C. elegans<\/em>", "part": 2, "source": "", "stem": "<p>True or false: the nematode <em>C. elegans<\/em> is a valuable model organism because every individual has the same defined set of cells, and how every cell develops over its lifespan is known.<\/p>", "options": [{"k": "A", "t": "True"}, {"k": "B", "t": "False"}], "answer": "<p><strong>A. True.<\/strong> It has a fixed set of cells, always the same number, and the fate of every cell in the body of a C. elegans is known. It is free-living. The dog parasite is heartworm, a different nematode.<\/p>", "note": "", "key": ["A"], "tf": true}, {"id": "A21", "title": "Arthropod segments", "part": 2, "source": "", "stem": "<p>How do the body segments of an arthropod such as a fly differ from those of an earthworm?<\/p>", "options": [{"k": "A", "t": "Arthropods have no segments at all"}, {"k": "B", "t": "Arthropod segments are all identical and repeat along the body, while earthworm segments are fused"}, {"k": "C", "t": "Arthropod segments are separated by fluid-filled septa that form a hydrostatic skeleton"}, {"k": "D", "t": "Arthropod segments are functionally fused into specialized body regions, such as the head, thorax and abdomen of an insect"}], "answer": "<p><strong>D.<\/strong> Their body segments tend to be functionally fused into 3 body regions, the head, the thorax and the abdomen, each built from several segments. Repeated, near-identical segments with septa (B, C) are the annelid pattern.<\/p>", "note": "", "key": ["D"], "tf": false}, {"id": "A22", "title": "Maggots and flies", "part": 2, "source": "", "stem": "<p>Fly larvae (maggots) sit and feed in rotting food, while the winged adults fly off to find mates and new food. This example illustrates which reason for the success of arthropods?<\/p>", "options": [{"k": "A", "t": "metamorphosis lets different life stages specialize in different ways of living, which reduces competition between juveniles and adults of the same species"}, {"k": "B", "t": "the exoskeleton can be strengthened with calcium salts"}, {"k": "C", "t": "moulting lets the exoskeleton grow continuously without being shed"}, {"k": "D", "t": "the larvae and adults compete for the same food, so only the strongest survive"}], "answer": "<p><strong>A.<\/strong> The different stages of development can be very different, which reduces competition within the species. B is a real reason too, but it is about the crustacean exoskeleton, not this example. C is backwards: the skeleton can't grow, so it has to be shed.<\/p>", "note": "", "key": ["A"], "tf": false}, {"id": "A23", "title": "Are the crustaceans a natural group?", "part": 2, "source": "", "stem": "<p>An arthropod tree reads, from the base: Chelicerates branch off first, then Myriapods, then one group of crustaceans; the last split separates a second group of crustaceans from its sister group, the Insects. A group \"Crustacea\" that includes both crustacean groups but leaves out the insects is…<\/p>", "options": [{"k": "A", "t": "monophyletic"}, {"k": "B", "t": "polyphyletic"}, {"k": "C", "t": "paraphyletic"}, {"k": "D", "t": "a synapomorphy of the Ecdysozoa"}], "answer": "<p><strong>C.<\/strong> It includes the common ancestor of all crustaceans but leaves out one of its descendant groups (the insects), so it is paraphyletic (the tree alone settles it). It's the same logic as fish without the tetrapods, or green algae without the land plants. Polyphyletic would mean taxa lumped together on homoplasious characters, like \"algae.\"<\/p>", "note": "", "key": ["C"], "tf": false}, {"id": "A24", "title": "Why are sea stars Bilateria?", "part": 2, "source": "", "stem": "<p>Adult sea stars have pentaradial symmetry, yet echinoderms are placed in the Bilateria. Why?<\/p>", "options": [{"k": "A", "t": "Their larvae are bilaterally symmetrical, and they descend from bilaterian ancestors; the five-part symmetry appears in the adult"}, {"k": "B", "t": "Their blastopore becomes the mouth, which defines Bilateria"}, {"k": "C", "t": "Pentaradial symmetry is a type of bilateral symmetry"}, {"k": "D", "t": "They are closely related to the cnidarians, which are also radial"}], "answer": "<p><strong>A.<\/strong> They haven't lost bilateral symmetry completely: the larvae are bilaterally symmetric, and only the adults lose it. B is wrong twice: echinoderms are deuterostomes (blastopore → anus), and that trait splits <em>within<\/em> Bilateria. D: the shared radial symmetry is homoplasy, not kinship.<\/p>", "note": "", "key": ["A"], "tf": false}, {"id": "A25", "title": "Echinoderms in fresh water?", "part": 2, "source": "", "stem": "<p>True or false: echinoderms such as sea urchins and sea cucumbers are found in both marine and freshwater habitats.<\/p>", "options": [{"k": "A", "t": "True"}, {"k": "B", "t": "False"}], "answer": "<p><strong>B. False.<\/strong> Echinoderms are found <strong>only<\/strong> in the world's oceans. They cannot cope with fresh water flowing into the body and simply die. Their water vascular system runs on seawater.<\/p>", "note": "", "key": ["B"], "tf": true}, {"id": "A26", "title": "Not a chordate synapomorphy", "part": 2, "source": "", "stem": "<p>Which of the following is NOT one of the five shared characters of all chordates?<\/p>", "options": [{"k": "A", "t": "Notochord"}, {"k": "B", "t": "Dorsal tubular nerve cord"}, {"k": "C", "t": "A vertebral column of bony vertebrae"}, {"k": "D", "t": "Endostyle or thyroid gland"}], "answer": "<p><strong>C.<\/strong> Not all chordates have a backbone. Vertebrae define the subphylum Vertebrata; tunicates and lancelets lack them. The five are notochord, dorsal tubular nerve cord, pharyngeal pouches, endostyle/thyroid, and post-anal tail.<\/p>", "note": "", "key": ["C"], "tf": false}, {"id": "A27", "title": "Endostyle and thyroid", "part": 2, "source": "", "stem": "<p>The endostyle of a lancelet and the thyroid gland of a human are best described as…<\/p>", "options": [{"k": "A", "t": "homologous: the mucus-producing endostyle changed over time into the thyroid gland in many chordates"}, {"k": "B", "t": "analogous: they do the same job but evolved independently"}, {"k": "C", "t": "the result of convergent evolution in two unrelated phyla"}, {"k": "D", "t": "unrelated structures that happen to sit in the same part of the body"}], "answer": "<p><strong>A.<\/strong> Humans have no endostyle, but they do have a thyroid gland, and the two are homologous: both develop from the same place in the embryo. Lancelets and humans are both chordates, so C (unrelated phyla) is wrong on its face.<\/p>", "note": "", "key": ["A"], "tf": false}, {"id": "A28", "title": "What a notochord is", "part": 2, "source": "", "stem": "<p>Which statement about the notochord is TRUE?<\/p>", "options": [{"k": "A", "t": "It is the bony spinal column that surrounds the nerve cord in all chordates"}, {"k": "B", "t": "It is a hollow nerve cord running along the ventral side of the body"}, {"k": "C", "t": "It is found only in the adults of tunicates and lancelets, never in vertebrates"}, {"k": "D", "t": "It is a flexible rod that keeps the same length when the body bends; in vertebrates it develops in the embryo and is then largely replaced by the vertebrae"}], "answer": "<p><strong>D.<\/strong> A is a common confusion: the notochord is soft tissue, not a bony cord. B confuses it with the nerve cord, and chordates' nerve cord is dorsal. C: every chordate has a notochord at some point, vertebrates included (as embryos). It also gives the embryo directional signals (head end vs tail end).<\/p>", "note": "", "key": ["D"], "tf": false}, {"id": "A29", "title": "What every vertebrate has", "part": 2, "source": "", "stem": "<p>Which feature is shared by ALL vertebrates, including the jawless fishes (agnathans)?<\/p>", "options": [{"k": "A", "t": "A bony vertebral column surrounding the nerve cord"}, {"k": "B", "t": "Jaws"}, {"k": "C", "t": "A head with a brain, enclosed by a cranium"}, {"k": "D", "t": "A notochord that persists through adult life"}], "answer": "<p><strong>C.<\/strong> \"Craniates\" is the more appropriate name since all have a head with a brain, while agnathans (jawless fish) lack vertebrae, which rules out A; B fails by the agnathans' very name. D: in vertebrates the notochord develops in the embryo and is quickly replaced by the vertebrae.<\/p>", "note": "", "key": ["C"], "tf": false}, {"id": "A30", "title": "Chordates that are not vertebrates", "part": 2, "source": "", "stem": "<p>Which pair of animals are chordates but NOT vertebrates?<\/p>", "options": [{"k": "A", "t": "Frogs and lizards"}, {"k": "B", "t": "Acorn worms and sea stars"}, {"k": "C", "t": "Tunicates (sea squirts) and lancelets"}, {"k": "D", "t": "Sharks and rays"}], "answer": "<p><strong>C.<\/strong> Tunicata and Cephalochordata are the odd cousins of the vertebrates: marine, few species, with all five chordate characters but no skull or vertebrae. A are tetrapods and D cartilaginous fishes, all vertebrates. B are deuterostomes outside Chordata (hemichordates and echinoderms).<\/p>", "note": "", "key": ["C"], "tf": false}, {"id": "G1", "title": "Who is not in the Archaeplastida?", "part": 3, "source": "", "stem": "<p>Which of these groups does NOT belong to the supergroup Archaeplastida?<\/p>", "options": [{"k": "A", "t": "Red algae"}, {"k": "B", "t": "Green algae"}, {"k": "C", "t": "Land plants"}, {"k": "D", "t": "Brown algae"}], "answer": "<p><strong>D.<\/strong> Brown algae (and diatoms) sit in the SAR/Stramenopile part of the tree. Archaeplastida holds the glaucocystophytes, red algae, green algae and land plants. Being photosynthetic doesn't put a group in Archaeplastida.<\/p>", "note": "", "key": ["D"], "tf": false}, {"id": "G2", "title": "Is \"algae\" a clade?", "part": 3, "source": "", "stem": "<p>True or false: \"Algae\" is a monophyletic group made up of all the photosynthetic eukaryotes.<\/p>", "options": [{"k": "A", "t": "True"}, {"k": "B", "t": "False"}], "answer": "<p><strong>B. False.<\/strong> \"Algae\" is a polyphyletic term: photosynthetic eukaryotes turn up across several supergroups (red and green algae in Archaeplastida, brown algae and diatoms in SAR).<\/p>", "note": "", "key": ["B"], "tf": true}, {"id": "G3", "title": "Why red algae look red", "part": 3, "source": "", "stem": "<p>Which pigment, present in large amounts, gives red algae their red colour?<\/p>", "options": [{"k": "A", "t": "Chlorophyll b"}, {"k": "B", "t": "Carotenoids"}, {"k": "C", "t": "Phycoerythrin"}, {"k": "D", "t": "Allophycocyanin"}], "answer": "<p><strong>C.<\/strong> Phycoerythrin absorbs in the red part of the spectrum, and there is a lot of it in these cells, which is why they look red. Phycocyanin and allophycocyanin work in the bluer range. Chlorophyll b and carotenoids are the green-algae pigments.<\/p>", "note": "", "key": ["C"], "tf": false}, {"id": "G4", "title": "What accessory pigments do", "part": 3, "source": "", "stem": "<p>In red algae, what is the role of phycoerythrin, phycocyanin and allophycocyanin?<\/p>", "options": [{"k": "A", "t": "They replace chlorophyll a as the main photosynthetic pigment"}, {"k": "B", "t": "They act as \"antennae\": they absorb other wavelengths of light and pass the energy on to chlorophyll a"}, {"k": "C", "t": "They harden the cell wall, as agar and carrageenan do"}, {"k": "D", "t": "They power the flagella of the gametes"}], "answer": "<p><strong>B.<\/strong> Chlorophyll a is the main pigment that does the heavy lifting. The accessory pigments widen the range of light the cell can use. D is doubly wrong because red algae have no flagella.<\/p>", "note": "", "key": ["B"], "tf": false}, {"id": "G5", "title": "Which is FALSE of Rhodophyta?", "part": 3, "source": "", "stem": "<p>Which statement about the phylum Rhodophyta is FALSE?<\/p>", "options": [{"k": "A", "t": "Their gametes are flagellated sperm and eggs, as in animals"}, {"k": "B", "t": "Their cell walls contain cellulose and pectin, plus agar and carrageenan"}, {"k": "C", "t": "Most species are marine, but some live in fresh water"}, {"k": "D", "t": "Their life cycles show alternation of generations"}], "answer": "<p><strong>A.<\/strong> Red algae have no flagella at any stage, so their gametes are not sperm and eggs. The generic diagram says \"egg/sperm\", but in red algae they are just gametes. B, C and D are all true of red algae.<\/p>", "note": "", "key": ["A"], "tf": false}, {"id": "G6", "title": "Irish moss on the beach", "part": 3, "source": "", "stem": "<p><em>Chondrus<\/em> (\"Irish moss\") is collected from beaches in Eastern Canada. What is it harvested for?<\/p>", "options": [{"k": "A", "t": "Sheets of nori to wrap sushi"}, {"k": "B", "t": "Agar and carrageenan, used as thickening agents (agar is also used in microbiology)"}, {"k": "C", "t": "A dried, single-celled protein supplement"}, {"k": "D", "t": "Shells on which to seed red algal farms"}], "answer": "<p><strong>B.<\/strong> Both molecules come from the red algal cell wall. A is <em>Pyropia<\/em>. C is the green alga <em>Chlorella<\/em>. D mixes in the bivalve shells used to farm <em>Pyropia<\/em>.<\/p>", "note": "", "key": ["B"], "tf": false}, {"id": "G7", "title": "Where meiosis happens", "part": 3, "source": "", "stem": "<p>In an organism with alternation of generations, where does meiosis occur?<\/p>", "options": [{"k": "A", "t": "In the gametophyte, as it makes gametes"}, {"k": "B", "t": "In the sporophyte, as it makes spores"}, {"k": "C", "t": "In every gamete, just before fusion"}, {"k": "D", "t": "In each spore, as it germinates"}], "answer": "<p><strong>B.<\/strong> The diploid sporophyte makes haploid spores (meiospores) by meiosis. The gametophyte is already haploid and makes gametes by <strong>mitosis<\/strong>, so there is no meiosis at that stage.<\/p>", "note": "", "key": ["B"], "tf": false}, {"id": "G8", "title": "Spore or gamete?", "part": 3, "source": "", "stem": "<p>A haploid cell is released and, <strong>without fusing with any other cell<\/strong>, grows by mitosis into a multicellular haploid body. What is this cell?<\/p>", "options": [{"k": "A", "t": "A gamete"}, {"k": "B", "t": "A zygote"}, {"k": "C", "t": "A meiospore"}, {"k": "D", "t": "A sporophyte"}], "answer": "<p><strong>C.<\/strong> A spore grows on its own into the gametophyte. A gamete has to fuse with another gamete first, and a zygote is diploid. Saying \"meiospores\" helps keep spores and gametes apart.<\/p>", "note": "", "key": ["C"], "tf": false}, {"id": "G9", "title": "The animal trap", "part": 3, "source": "", "stem": "<p>True or false: In plants and algae with alternation of generations, gametes are produced by meiosis, just as they are in animals.<\/p>", "options": [{"k": "A", "t": "True"}, {"k": "B", "t": "False"}], "answer": "<p><strong>B. False.<\/strong> In alternation of generations, meiosis makes <strong>spores<\/strong>. Gametes come from the haploid gametophyte by mitosis. \"Meiosis makes gametes\" is true only of the animal life cycle.<\/p>", "note": "", "key": ["B"], "tf": true}, {"id": "G10", "title": "Which stage is haploid?", "part": 3, "source": "", "stem": "<p>Which of these is haploid (1n)?<\/p>", "options": [{"k": "A", "t": "The zygote"}, {"k": "B", "t": "The sporophyte"}, {"k": "C", "t": "The cell in the sporophyte that is about to undergo meiosis"}, {"k": "D", "t": "The gametophyte"}], "answer": "<p><strong>D.<\/strong> Haploid gametophyte, diploid sporophyte. The zygote is the first diploid cell, and the reproductive cell in the sporophyte is still 2n until meiosis halves it.<\/p>", "note": "", "key": ["D"], "tf": false}, {"id": "G11", "title": "An animal, or alternation of generations?", "part": 3, "source": "", "stem": "<p>An organism's only multicellular body is diploid. That body makes haploid gametes by meiosis, and the gametes fuse to form a diploid zygote. Which organism fits?<\/p>", "options": [{"k": "A", "t": "<em>Ulva<\/em>"}, {"k": "B", "t": "<em>Chara<\/em>"}, {"k": "C", "t": "A sea star"}, {"k": "D", "t": "<em>Chondrus<\/em>"}], "answer": "<p><strong>C.<\/strong> This is the animal life cycle: a diploid adult, gametes by meiosis, no multicellular haploid stage. <em>Ulva<\/em> and <em>Chondrus<\/em> have both a haploid and a diploid multicellular body. <em>Chara<\/em> is the mirror image: its only body is <strong>haploid<\/strong>.<\/p>", "note": "", "key": ["C"], "tf": false}, {"id": "G12", "title": "No shortcuts", "part": 3, "source": "", "stem": "<p>For centuries <em>Pyropia<\/em> (nori) could only be collected from the wild, not farmed at scale. What changed this?<\/p>", "options": [{"k": "A", "t": "Breeding a strain whose gametophyte makes new gametophytes directly, skipping the sporophyte"}, {"k": "B", "t": "Learning that its small diploid stage grows on bivalve shells, so farmers could hang shells to complete the life cycle"}, {"k": "C", "t": "Discovering that its gametes are flagellated and can be released into nets"}, {"k": "D", "t": "Learning to germinate its zygotes on dry land"}], "answer": "<p><strong>B.<\/strong> There are no shortcuts: you have to go gametophyte → sporophyte → gametophyte. Once people knew the sporophyte phase lives on shells, strings of oyster shells could seed the nets. A is exactly the shortcut that doesn't exist, and C is wrong because red algae have no flagella.<\/p>", "note": "", "key": ["B"], "tf": false}, {"id": "G13", "title": "The nori on your sushi", "part": 3, "source": "", "stem": "<p>The sheet of nori wrapped around sushi is which stage of <em>Pyropia<\/em>?<\/p>", "options": [{"k": "A", "t": "The haploid gametophyte (gametothallus)"}, {"k": "B", "t": "The diploid sporophyte"}, {"k": "C", "t": "A colony of diploid zygotes"}, {"k": "D", "t": "A mass of meiospores pressed together"}], "answer": "<p><strong>A.<\/strong> The big, leafy, laminar sheet is the haploid phase, the gametothallus: that is the gametophyte people eat. The diploid sporophyte is the nearly microscopic stage on shells.<\/p>", "note": "", "key": ["A"], "tf": false}, {"id": "G14", "title": "Conchocelis", "part": 3, "source": "", "stem": "<p>The <em>conchocelis<\/em> stage of <em>Pyropia<\/em> is a tiny, branched, filamentous phase found on bivalve shells. Which statement is correct?<\/p>", "options": [{"k": "A", "t": "It is the haploid gametophyte, and it makes the leafy sheet by meiosis"}, {"k": "B", "t": "It is a separate species of red alga that lives with <em>Pyropia<\/em>"}, {"k": "C", "t": "It is the diploid sporophyte, and because it looks so different from the leafy sheet, <em>Pyropia<\/em> is heteromorphic"}, {"k": "D", "t": "It is the diploid sporophyte, and <em>Pyropia<\/em> is isomorphic because both stages are multicellular"}], "answer": "<p><strong>C.<\/strong> Heteromorphic means the two generations look different: a big leafy 1n sheet and a tiny 2n filament. D uses the wrong definition, because isomorphic means the two stages <em>look alike<\/em>, not just that both are multicellular.<\/p>", "note": "", "key": ["C"], "tf": false}, {"id": "G15", "title": "Telling Chondrus generations apart", "part": 3, "source": "", "stem": "<p>True or false: The gametophyte and sporophyte of <em>Chondrus<\/em> look so different that harvesters can easily sort them by eye on the beach.<\/p>", "options": [{"k": "A", "t": "True"}, {"k": "B", "t": "False"}], "answer": "<p><strong>B. False.<\/strong> <em>Chondrus<\/em> is <strong>isomorphic<\/strong>: you could tell the two apart only by counting chromosomes under a microscope. Because the two look alike, harvesters simply collect both generations together.<\/p>", "note": "", "key": ["B"], "tf": true}, {"id": "G16", "title": "Pigments in green algae but not in red algae", "part": 3, "source": "", "stem": "<p>Which pigment is found in green algae and land plants but was NOT listed for the red algae?<\/p>", "options": [{"k": "A", "t": "Chlorophyll a"}, {"k": "B", "t": "Chlorophyll b"}, {"k": "C", "t": "Phycocyanin"}, {"k": "D", "t": "Phycoerythrin"}], "answer": "<p><strong>B.<\/strong> Green algae and land plants have chlorophylls a <strong>and b<\/strong>, plus carotenoids, and they lack the red-algal phycobilin pigments. Chlorophyll a is shared by both groups, and C and D are red-algae pigments. These red vs green-plus-land-plant synapomorphies are worth knowing.<\/p>", "note": "", "key": ["B"], "tf": false}, {"id": "G17", "title": "Flagella of chlorophytes", "part": 3, "source": "", "stem": "<p>Which description of flagella in the Chlorophyta is correct?<\/p>", "options": [{"k": "A", "t": "They have one smooth and one tinsel (hairy) flagellum"}, {"k": "B", "t": "They have no flagella at any stage, like the red algae"}, {"k": "C", "t": "Their flagella are all of the tinsel type"}, {"k": "D", "t": "Flagellated forms have 2 or 4 smooth, whiplash-type flagella and no tinsel flagella"}], "answer": "<p><strong>D.<\/strong> Green algae lack the tinsel flagellum. A describes a cell with one tinsel flagellum, which is exactly the type green algae <em>don't<\/em> have. B describes the red algae.<\/p>", "note": "", "key": ["D"], "tf": false}, {"id": "G18", "title": "Reading the Archaeplastida tree", "part": 3, "source": "", "stem": "<p>On a common tree, the Archaeplastida branch as: Glaucocystophytes, then Red algae, then a clade of (Chlorophytes + Flagellated unicells + Streptophyte algae + Land plants). Which grouping is <strong>monophyletic<\/strong>?<\/p>", "options": [{"k": "A", "t": "Green algae, excluding land plants"}, {"k": "B", "t": "All Archaeplastida except the red algae"}, {"k": "C", "t": "Green algae plus land plants (Viridiplantae)"}, {"k": "D", "t": "Red algae plus green algae, excluding land plants"}], "answer": "<p><strong>C.<\/strong> It contains a common ancestor and all its descendants. A, B and D each leave out some descendants, so each is paraphyletic. A is a classic example: the phylum Chlorophyta is paraphyletic because it doesn't include the land plants.<\/p>", "note": "", "key": ["C"], "tf": false}, {"id": "G19", "title": "Chlamydomonas and Volvox", "part": 3, "source": "", "stem": "<p>Which statement about <em>Chlamydomonas<\/em> and <em>Volvox<\/em> is FALSE?<\/p>", "options": [{"k": "A", "t": "<em>Chlamydomonas<\/em> is a single cell that lives on its own and has two whiplash flagella"}, {"k": "B", "t": "A <em>Volvox<\/em> colony forms when free-living <em>Chlamydomonas<\/em> cells meet and stick together"}, {"k": "C", "t": "A <em>Volvox<\/em> colony is a ball of hundreds to thousands of cells, each resembling a <em>Chlamydomonas<\/em> cell"}, {"k": "D", "t": "A single cell removed from a <em>Volvox<\/em> colony is unlikely to survive on its own"}], "answer": "<p><strong>B.<\/strong> B is the false statement and a classic trap: these are different species. The cells look alike, but <em>Chlamydomonas<\/em> doesn't team up to make <em>Volvox<\/em>.<\/p>", "note": "", "key": ["B"], "tf": false}, {"id": "G20", "title": "Morphological trends in the green algae", "part": 3, "source": "", "stem": "<p>Which statement about green algal body forms is correct?<\/p>", "options": [{"k": "A", "t": "Unicellular forms were likely basal; both flagellated and unflagellated species exist, and either kind can form colonies"}, {"k": "B", "t": "All green algae are microscopic and unicellular"}, {"k": "C", "t": "Only flagellated species can form colonies"}, {"k": "D", "t": "The earliest green algae were large multicellular sheets, which later broke apart into single cells"}], "answer": "<p><strong>A.<\/strong> This is the standard summary of the trend. B is wrong because of <em>Ulva<\/em>, <em>Caulerpa<\/em> and the like, which are big enough to see clearly. D reverses the trend.<\/p>", "note": "", "key": ["A"], "tf": false}, {"id": "G21", "title": "Ulva in two words", "part": 3, "source": "", "stem": "<p>Which pair of terms describes <em>Ulva<\/em> (sea lettuce)?<\/p>", "options": [{"k": "A", "t": "Heteromorphic and isogamous"}, {"k": "B", "t": "Isomorphic and isogamous"}, {"k": "C", "t": "Isomorphic and oogamous"}, {"k": "D", "t": "Heteromorphic and oogamous"}], "answer": "<p><strong>B.<\/strong> The sporophyte and gametophyte look alike (isomorphic), and the gametes look alike too (isogamous, so they're called + and − rather than male and female). The <em>-morphic<\/em> terms describe the bodies and the <em>-gamy<\/em> terms describe the gametes, so the two are independent.<\/p>", "note": "", "key": ["B"], "tf": false}, {"id": "G22", "title": "The Ulva cycle in order", "part": 3, "source": "", "stem": "<p>Which sequence correctly traces the life cycle of <em>Ulva<\/em>?<\/p>", "options": [{"k": "A", "t": "Sporophyte → (meiosis) → gametes → fusion → zygote → (mitosis) → gametophyte"}, {"k": "B", "t": "Gametophyte → (meiosis) → gametes → fusion → zygote → (mitosis) → sporophyte"}, {"k": "C", "t": "Sporophyte → (meiosis) → flagellated spores → (mitosis) → gametophyte → (mitosis) → look-alike gametes → fusion → quadriflagellate zygote → (mitosis) → sporophyte"}, {"k": "D", "t": "Zygote → (meiosis) → spores → (mitosis) → gametophyte → (mitosis) → gametes → fusion → zygote, with no multicellular diploid stage"}], "answer": "<p><strong>C.<\/strong> Two gametes, each with two flagella, fuse into a four-flagellated zygote. The zygote settles and grows by mitosis into the sporophyte, and meiosis in the sporophyte's tissue releases spores. A and B put meiosis at the gametes. D is the <em>Chara<\/em> cycle.<\/p>", "note": "", "key": ["C"], "tf": false}, {"id": "G23", "title": "Why sea lettuce blooms are a problem", "part": 3, "source": "", "stem": "<p>Massive <em>Ulva<\/em> blooms appear in intertidal zones that receive runoff from farms, towns and treatment plants. Which explanation is correct?<\/p>", "options": [{"k": "A", "t": "Runoff lowers the water temperature, which triggers meiosis"}, {"k": "B", "t": "Runoff adds nutrients such as nitrogen and phosphorus, the alga overgrows, and when it dies and rots, the decomposing bacteria use up oxygen and can kill fish and crustaceans"}, {"k": "C", "t": "<em>Ulva<\/em> produces phycoerythrin that poisons nearby animals"}, {"k": "D", "t": "Runoff carries bivalve shells that <em>Ulva<\/em> needs to complete its life cycle"}], "answer": "<p><strong>B.<\/strong> Nutrient input, then overgrowth, then die-off and rot, then oxygen depletion, and a bad smell. C uses a red-algae pigment, and D borrows the <em>Pyropia<\/em> shell story.<\/p>", "note": "", "key": ["B"], "tf": false}, {"id": "G24", "title": "Creeping stolon", "part": 3, "source": "", "stem": "<p>Which green alga grows a long, root-like <strong>stolon<\/strong> with small upright \"plants\" springing up from it, and can wrap around boat propellers and clog intake pipes?<\/p>", "options": [{"k": "A", "t": "<em>Chlamydomonas<\/em>"}, {"k": "B", "t": "<em>Volvox<\/em>"}, {"k": "C", "t": "<em>Chara<\/em>"}, {"k": "D", "t": "<em>Caulerpa<\/em>"}], "answer": "<p><strong>D.<\/strong> <em>Caulerpa<\/em>. The stolon keeps getting longer, and dense growth causes these problems for boats and pipes.<\/p>", "note": "", "key": ["D"], "tf": false}, {"id": "G25", "title": "Why the jacket matters", "part": 3, "source": "", "stem": "<p>In <em>Chara<\/em> (stoneworts), the egg is kept on the parent inside a jacket of cells. Why is this feature singled out?<\/p>", "options": [{"k": "A", "t": "The jacket lets the egg photosynthesize with phycoerythrin"}, {"k": "B", "t": "The jacket protects the egg from drying out, and protecting the egg on the parent became a common feature of land plants"}, {"k": "C", "t": "The jacket is where meiosis produces the egg"}, {"k": "D", "t": "The jacket makes the egg float so sperm can find it at the surface"}], "answer": "<p><strong>B.<\/strong> Keeping gametes from drying out matters a great deal for organisms that start to move away from the water. C is the trap: the egg is made on the haploid gametophyte, so no meiosis happens there.<\/p>", "note": "", "key": ["B"], "tf": false}, {"id": "G26", "title": "Meiosis in Chara", "part": 3, "source": "", "stem": "<p>In the <em>Chara<\/em> life cycle, where does meiosis take place?<\/p>", "options": [{"k": "A", "t": "In the zygote, when it leaves its overwintering state in spring"}, {"k": "B", "t": "In the jacketed structure, to make the egg"}, {"k": "C", "t": "In a multicellular diploid sporophyte that grows in the summer"}, {"k": "D", "t": "In the sperm, just before fertilization"}], "answer": "<p><strong>A.<\/strong> The fertilized egg becomes a single diploid cell that falls into the sediment and overwinters. Environmental signals in spring (light, temperature) trigger meiosis, and the haploid cells grow into a new gametophyte. <em>Chara<\/em> has no multicellular diploid sporophyte at all.<\/p>", "note": "", "key": ["A"], "tf": false}, {"id": "G27", "title": "Chara's only diploid cell", "part": 3, "source": "", "stem": "<p>True or false: In <em>Chara<\/em>, the zygote is the only diploid cell in the whole life cycle, and the haploid gametophyte is the dominant stage.<\/p>", "options": [{"k": "A", "t": "True"}, {"k": "B", "t": "False"}], "answer": "<p><strong>A. True.<\/strong> The stonewort plant you see all growing season is haploid. The diploid generation is just the one-celled zygote that overwinters.<\/p>", "note": "", "key": ["A"], "tf": true}, {"id": "G28", "title": "What defines Plants s.s.?", "part": 3, "source": "", "stem": "<p>Which of these is NOT a characteristic of the land plants (Plants <em>sensu stricto<\/em>)?<\/p>", "options": [{"k": "A", "t": "Complex multicellularity"}, {"k": "B", "t": "Chlorophylls a and b, with carotenoids"}, {"k": "C", "t": "Some species are single-celled, like <em>Chlamydomonas<\/em>"}, {"k": "D", "t": "A single egg cell held in a unique protective organ"}], "answer": "<p><strong>C.<\/strong> There are no single-celled land plants. All the other options are true of land plants, along with alternation of generations.<\/p>", "note": "", "key": ["C"], "tf": false}, {"id": "G29", "title": "The main problem of life on land", "part": 3, "source": "", "stem": "<p>What was the central challenge for the green algal lineage that moved onto land about 450 million years ago, and what is one adaptation that addressed it?<\/p>", "options": [{"k": "A", "t": "Getting enough light; solved by evolving phycoerythrin"}, {"k": "B", "t": "Avoiding predators; solved by calcified cell walls"}, {"k": "C", "t": "Preventing drying out; one solution is a waxy cuticle over the plant's surface"}, {"k": "D", "t": "Surviving cold winters; solved by an overwintering diploid zygote"}], "answer": "<p><strong>C.<\/strong> The challenges were keeping from drying out and getting gametes to meet without free water. The waxy cuticle was an early step in allowing plants to leave free-standing water behind. The first land plants were small and had no leaves, vessels or roots. D borrows the <em>Chara<\/em> overwintering story, which is about temperate seasons, not the move to land.<\/p>", "note": "", "key": ["C"], "tf": false}, {"id": "G31", "title": "Which generation dominates in a moss?", "part": 3, "source": "", "stem": "<p>In a moss, which statement about the two generations is correct?<\/p>", "options": [{"k": "A", "t": "The diploid sporophyte is dominant, and the gametophyte is a tiny cell that falls into the sediment"}, {"k": "B", "t": "The two generations look alike and live separately (isomorphic)"}, {"k": "C", "t": "The sporophyte is dominant, and the gametophyte grows on it as a brown stalk"}, {"k": "D", "t": "The green, leafy haploid gametophyte is dominant, and the brown, stalked diploid sporophyte grows from it and depends on it for water and nutrients"}], "answer": "<p><strong>D.<\/strong> In bryophytes the gametophyte is dominant, and the brown, crusty-looking structure is a dependent sporophyte. The sporophyte's sporangium releases meiospores into the air. C swaps the roles, and A reverses <em>Chara<\/em>'s pattern (in <em>Chara<\/em> the gametophyte dominates and the lone diploid cell sinks into the sediment).<\/p>", "note": "", "key": ["D"], "tf": false}, {"id": "M1", "title": "Flagella of the green algae", "part": 4, "source": "", "stem": "<p>Which describes the flagella of a swimming chlorophyte cell such as <em>Chlamydomonas<\/em>?<\/p>", "options": [{"k": "A", "t": "Two flagella of different types: one tinsel (hairy), one whiplash (smooth)"}, {"k": "B", "t": "Two flagella of the same type, both smooth (whiplash)"}, {"k": "C", "t": "No flagella at any stage of the life cycle"}, {"k": "D", "t": "Many short cilia covering the cell surface"}], "answer": "<p><strong>B.<\/strong> Green algae have only the smooth whiplash type: two whiplash flagella on the cell. The tinsel type is the contrast case; chlorophytes have none. A describes the stramenopiles (also called heterokonts; Greek <em>heteros<\/em> \"different\" + <em>kontos<\/em> \"pole\"), such as diatoms and brown algae in SAR. C is the red algae. Hook: <em>Chlamydomonas<\/em> swims breaststroke, two matching smooth arms.<\/p>", "note": "", "key": ["B"], "tf": false}, {"id": "M2", "title": "The group with no flagella at all", "part": 4, "source": "", "stem": "<p>Which group of Archaeplastida has <strong>no flagella at any stage<\/strong>, so that its gametes are not called sperm and egg?<\/p>", "options": [{"k": "A", "t": "Chlorophyta (green algae)"}, {"k": "B", "t": "Charophyta (<em>Chara<\/em>)"}, {"k": "C", "t": "Rhodophyta (red algae)"}, {"k": "D", "t": "Land plants (Plantae <em>sensu stricto<\/em>)"}], "answer": "<p><strong>C.<\/strong> Red algae have no flagella, so their gametes are not sperm and egg. Green algae and <em>Chara<\/em> have flagellated cells; <em>Chara<\/em>'s sperm swim to the egg.<\/p>", "note": "", "key": ["C"], "tf": false}, {"id": "M3", "title": "The <em>Ulva<\/em> zygote", "part": 4, "source": "", "stem": "<p>Two <em>Ulva<\/em> gametes, each with two whiplash flagella, fuse. How many flagella does the zygote have right after fusion?<\/p>", "options": [{"k": "A", "t": "None"}, {"k": "B", "t": "One"}, {"k": "C", "t": "Two"}, {"k": "D", "t": "Four"}], "answer": "<p><strong>D.<\/strong> Biflagellate gametes fuse into a quadriflagellated zygote. It soon settles on a hard surface and grows by mitosis into the multicellular diploid sporophyte, which looks like the gametophyte (isomorphic).<\/p>", "note": "", "key": ["D"], "tf": false}, {"id": "M4", "title": "Where fertilization happens in <em>Chara<\/em>", "part": 4, "source": "", "stem": "<p>Where does fertilization take place in <em>Chara<\/em>?<\/p>", "options": [{"k": "A", "t": "In open water, after both the egg and the sperm are released"}, {"k": "B", "t": "Inside the jacket around the egg, while the egg is still on the parent plant"}, {"k": "C", "t": "On the diploid sporophyte, which carries both eggs and sperm"}, {"k": "D", "t": "In the sediment, after the zygote sinks for the winter"}], "answer": "<p><strong>B.<\/strong> Flagellated sperm swim to the jacketed egg of the parent <em>Chara<\/em>, enter the jacket and fertilize the egg. Only the sperm swim; the egg stays put, protected from drying out. The zygote then falls out of the jacket and sinks (D is what happens <em>after<\/em> fertilization). C is wrong because <em>Chara<\/em> has no multicellular sporophyte.<\/p>", "note": "", "key": ["B"], "tf": false}, {"id": "M5", "title": "The <em>Chara<\/em> plant you see", "part": 4, "source": "", "stem": "<p>The visible <em>Chara<\/em> plant in a pond is the haploid gametophyte, and the zygote is the only diploid stage of its life cycle.<\/p>", "options": [{"k": "A", "t": "True"}, {"k": "B", "t": "False"}], "answer": "<p><strong>A, true.<\/strong> Almost the whole life cycle is the haploid phase; the diploid zygote is the only life stage of the diploid generation. The gametophyte makes eggs and sperm by mitosis; the zygote does meiosis in spring.<\/p>", "note": "", "key": ["A"], "tf": true}, {"id": "M6", "title": "Reptiles and birds", "part": 4, "source": "", "stem": "<p>On the vertebrate tree, crocodilians share a more recent common ancestor with birds than with lizards and snakes. Which statement follows?<\/p>", "options": [{"k": "A", "t": "\"Reptiles\" (turtles, lizards, snakes, crocodilians) without birds is monophyletic"}, {"k": "B", "t": "Reptiles together with birds form a monophyletic group; reptiles without birds are paraphyletic"}, {"k": "C", "t": "Reptiles together with birds form a polyphyletic group"}, {"k": "D", "t": "Birds and crocodilians share their similarities by convergent evolution"}], "answer": "<p><strong>B.<\/strong> Birds sit inside the reptile branch. Leaving them out drops one descendant of the common ancestor (paraphyletic); adding them back gives the ancestor and all its descendants (monophyletic). Caution: a group of only <em>some<\/em> reptiles plus birds (say lizards + birds, without crocodilians) would not be monophyletic.<\/p>", "note": "", "key": ["B"], "tf": false}, {"id": "M7", "title": "What counts as evidence for a tree", "part": 4, "source": "", "stem": "<p>DNA sequence data is the only kind of evidence that can be used to build a phylogenetic tree.<\/p>", "options": [{"k": "A", "t": "True"}, {"k": "B", "t": "False"}], "answer": "<p><strong>B, false.<\/strong> Any <strong>homologous<\/strong> character counts: morphology (amniotic egg, hair, cranium), molecular sequences, fossils. A character can be morphological or anatomical, such as having an organ or a certain type of cell. The rule is to include homologous characters and specifically exclude analogous ones. Watch for \"only\" in a true/false statement.<\/p>", "note": "", "key": ["B"], "tf": true}, {"id": "M8", "title": "The state kept from the ancestor", "part": 4, "source": "", "stem": "<p>A character state that is unchanged from the common ancestor of the group being studied is a(n):<\/p>", "options": [{"k": "A", "t": "Apomorphy"}, {"k": "B", "t": "Synapomorphy"}, {"k": "C", "t": "Autapomorphy"}, {"k": "D", "t": "Plesiomorphy"}], "answer": "<p><strong>D.<\/strong> Greek <em>plēsios<\/em> \"near\": the state stays near the ancestral form. An apomorphy (<em>apo-<\/em> \"away from\") is a derived state; a synapomorphy is a derived state shared by a group; an autapomorphy is a derived state found in only one lineage. The label depends on the node: hair is a synapomorphy of mammals but a plesiomorphy within mammals.<\/p>", "note": "", "key": ["D"], "tf": false}, {"id": "M9", "title": "Tips and nodes", "part": 4, "source": "", "stem": "<p>Which statement about a phylogenetic tree is correct?<\/p>", "options": [{"k": "A", "t": "Only the tips can be real organisms, and every tip must be a living species"}, {"k": "B", "t": "Each internal node represents an inferred common ancestor, usually long gone"}, {"k": "C", "t": "Each node is a living species from which the species above it descended"}, {"k": "D", "t": "The root is the most recently evolved taxon on the tree"}], "answer": "<p><strong>B.<\/strong> Nodes are theoretical ancestor populations that existed at some point; we may or may not know what they were. Tips can be many different things: species, large groups of species, even gene families, and extinct taxa can be tips too (a vertebrate tree can have a \"Non-avian dinosaurs\" tip), so A is false. The root is the <em>oldest<\/em> node.<\/p>", "note": "", "key": ["B"], "tf": false}]};
const STORE = "mock-midterm-generic-v1";
const Q = DATA.questions;
const byId = Object.fromEntries(Q.map(q => [q.id, q]));
const PARTS = DATA.parts.map((p, i) => ({ ...p, short: p.title.replace(/^Part \d+ · /, "").replace(/\s*\([A-Z]\)$/, ""), ids: Q.filter(q => q.part === i).map(q => q.id) }));

let S = { answers: {}, flags: {}, scope: "p0", order: "seq", seed: 1 };
try { const raw = localStorage.getItem(STORE); if (raw) S = { ...S, ...JSON.parse(raw) }; } catch (e) {}
if (!S.answers || typeof S.answers !== "object") S.answers = {};
if (!S.flags || typeof S.flags !== "object") S.flags = {};
if (!["seq", "rnd"].includes(S.order)) S.order = "seq";
if (!["all", "miss", "flag", "todo", "p0", "p1", "p2", "p3", "p4"].includes(S.scope)) S.scope = "p0";
if (!Number.isFinite(S.seed)) S.seed = 1;
// redo: ids cleared from Missed (by Try again or Reset → Missed) that are still unanswered; they stay in the Missed view until answered
if (!Array.isArray(S.redo)) S.redo = [];
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} };
const pending = {}; // multi-answer selections not yet checked

// seeded shuffle, so a reload keeps the same random order until Reshuffle
function rng(seed) { let t = seed >>> 0; return () => { t += 0x6D2B79F5; let r = Math.imul(t ^ t >>> 15, 1 | t); r ^= r + Math.imul(r ^ r >>> 7, 61 | r); return ((r ^ r >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, r) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function hash(s) { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; }

const isOk = (q, a) => !!a && !a.dk && Array.isArray(a.picked) && a.picked.length === q.key.length && a.picked.every(k => q.key.includes(k));
const state = id => { const a = S.answers[id]; return !a || !byId[id] ? "" : a.open ? "seen" : a.dk ? "dk" : isOk(byId[id], a) ? "right" : "wrong"; };
const isMiss = id => ["wrong", "dk"].includes(state(id));

function scopes() {
  return [
    { key: "all", name: "Everything", ids: Q.map(q => q.id), blurb: `All ${Q.length} questions across all ${PARTS.length} parts.` },
    ...PARTS.map((p, i) => ({ key: "p" + i, name: p.short, ids: p.ids, blurb: p.intro, part: i })),
    { key: "miss", name: "Missed", ids: Q.filter(q => isMiss(q.id) || (!S.answers[q.id] && S.redo.includes(q.id))).map(q => q.id), blurb: "Questions you got wrong or marked “I don't know”. Use Try again on a card to clear it, or Reset → Missed to clear them all; cleared ones stay here until you answer them." },
    { key: "flag", name: "Marked", ids: Q.filter(q => S.flags[q.id]).map(q => q.id), blurb: "Questions you marked as unsure. Click the mark on a card again to unmark it." },
    { key: "todo", name: "Not yet answered", ids: Q.filter(q => !state(q.id)).map(q => q.id), blurb: "Everything you haven't tried yet." },
  ];
}
const curScope = () => scopes().find(s => s.key === S.scope) || scopes()[1];

function tally() {
  const ans = Q.filter(q => q.options.length && state(q.id));
  const r = ans.filter(q => state(q.id) === "right").length, w = ans.filter(q => state(q.id) === "wrong").length, d = ans.filter(q => state(q.id) === "dk").length;
  const pct = ans.length ? Math.round(100 * r / ans.length) : 0;
  document.getElementById("tally").innerHTML =
    `<span><b>${ans.length}</b>/${Q.filter(q => q.options.length).length} answered</span><span class="r"><b>${r}</b> right</span><span class="w"><b>${w}</b> wrong</span><span class="d"><b>${d}</b> didn't know</span><span><b>${pct}%</b></span>`;
  if (typeof updateClearAsk === "function") updateClearAsk();
}

function renderRail() {
  const rail = document.getElementById("rail");
  const sc = scopes();
  const block = s => `<button class="scope" type="button" data-scope="${s.key}" aria-current="${S.scope === s.key}">
      <span class="top"><span class="name">${s.name}</span><span class="count">${s.part !== undefined ? s.ids.filter(state).length + "/" : ""}${s.ids.length}</span></span>
      ${s.part !== undefined ? `<span class="tray">${s.ids.map(id => `<span class="cell ${state(id)}${S.flags[id] ? " flagged" : ""}" data-jump="${id}" title="${id}${S.flags[id] ? " (marked)" : ""}"></span>`).join("")}</span>` : ""}
    </button>`;
  rail.innerHTML = block(sc[0]) + sc.slice(1, 6).map(block).join("") + `<div class="sep"></div>` + sc.slice(6).map(block).join("") +
    `<div class="legend"><span><i style="background:var(--right)"></i>right</span><span><i style="background:var(--wrong)"></i>wrong</span><span><i style="background:var(--dk)"></i>didn't know</span><span><i style="background:var(--muted)"></i>open, seen</span><span><i style="background:var(--empty)"></i>not tried</span><span><i style="background:var(--empty);box-shadow:inset 0 0 0 2px var(--label)"></i>marked</span></div>`;
}

function optionOrder(q) {
  if (S.order !== "rnd" || q.tf || !q.options.length) return q.options;
  const pinned = q.options.filter(o => /above/i.test(o.t));
  return [...shuffle(q.options.filter(o => !pinned.includes(o)), rng(S.seed ^ hash(q.id))), ...pinned];
}

function cardHTML(q, n) {
  const a = S.answers[q.id];
  const done = !!a;
  const multi = q.key.length > 1;
  const sel = a ? a.picked : (pending[q.id] || []);
  const opts = optionOrder(q).map(o => {
    let cls = "opt", mark = "";
    if (done) {
      if (q.key.includes(o.k)) { cls += " is-right"; mark = "answer"; }
      if (a.picked.includes(o.k) && !q.key.includes(o.k)) { cls += " is-wrong"; mark = "your pick"; }
      if (a.picked.includes(o.k) && q.key.includes(o.k) && multi) mark = "answer · picked";
      if (!a.picked.includes(o.k) && q.key.includes(o.k) && multi && !a.dk) { cls += " missed"; mark = "answer · you missed it"; }
    } else if (sel.includes(o.k)) cls += " picked";
    return `<button class="${cls}" type="button" data-q="${q.id}" data-k="${o.k}" ${done ? "disabled" : ""}><span class="k">${o.k}</span><span>${o.t}${mark ? `<span class="mark">${mark}</span>` : ""}</span></button>`;
  }).join("");
  const idk = q.options.length ? `<button class="opt idk ${done && a.dk ? "is-dk" : ""}" type="button" data-q="${q.id}" data-k="?" ${done ? "disabled" : ""}><span class="k">?</span><span>I don't know${done && a.dk ? `<span class="mark">marked</span>` : ""}</span></button>` : "";
  const verdict = !done ? "" : !q.options.length ? "" : a.dk ? `<span class="verdict dk">Didn't know</span>` : isOk(q, a) ? `<span class="verdict right">Right</span>` : `<span class="verdict wrong">Not quite</span>`;
  const reveal = done ? `<div class="reveal">${verdict}<div>${q.answer}</div>${q.note ? `<div class="note">${q.note}</div>` : ""}${q.source ? `<div class="src">Source: ${q.source}</div>` : ""}
      <div class="qfoot"><button class="link" type="button" data-retry="${q.id}">Try again</button></div></div>` : "";
  const multiCtl = !done && multi ? `<div class="multi-hint">More than one answer is right here. Pick every one, then <button class="link" type="button" data-check="${q.id}">check</button>.</div>` : "";
  const open = !q.options.length && !done ? `<div><button class="btn" type="button" data-open="${q.id}">Show answer</button> <span class="multi-hint">Open question: think it through first.</span></div>` : "";
  return `<article class="q${S.flags[q.id] ? " is-flagged" : ""}" id="q-${q.id}">
    <div class="qhead"><span class="qid">${q.id}</span><span class="qtitle ${done ? "" : "hidden"}">${done ? q.title : q.options.length ? "title shows after you answer" : "open question"}</span><button class="flag" type="button" data-flag="${q.id}" aria-pressed="${!!S.flags[q.id]}" title="Mark this question as unsure">${S.flags[q.id] ? "★ Marked" : "☆ Mark"}</button><span class="qnum">${n}</span></div>
    <div class="stem">${q.stem}</div>
    ${q.options.length ? `<div class="opts">${opts}${idk}</div>` : ""}${multiCtl}${open}${reveal}
  </article>`;
}

function renderMain() {
  const s = curScope();
  const main = document.getElementById("main");
  let ids = s.ids;
  if (S.order === "rnd") ids = shuffle(ids, rng(S.seed ^ hash(s.key)));
  let html = `<div class="scope-head"><h2>${s.name}</h2><p>${s.blurb || ""}${S.order === "rnd" ? (s.key === "all" || s.key === "miss" || s.key === "flag" || s.key === "todo" ? " Random order, mixed across all topics." : " Random order within this part.") : ""}</p></div>`;
  if (!ids.length) html += `<p class="empty">${s.key === "miss" ? "Nothing missed so far." : s.key === "flag" ? "Nothing marked yet. Use “Mark” on any question you're unsure about." : "You've tried every question."}</p>`;
  else if (S.order === "seq") {
    const partList = s.part !== undefined ? [PARTS[s.part]] : s.key === "all" ? PARTS : null;
    if (partList) {
      let n = 0;
      for (const p of partList) {
        if (s.key === "all") html += `<h3 class="sec" style="font-size:.9rem">${p.short}</h3>`;
        for (const sec of p.sections) {
          html += `<h3 class="sec">${sec.title}</h3>` + (sec.intro ? `<div class="sec-intro">${sec.intro}</div>` : "");
          html += sec.ids.map(id => cardHTML(byId[id], ++n)).join("");
        }
      }
    } else html += ids.map((id, i) => cardHTML(byId[id], i + 1)).join("");
  } else html += ids.map((id, i) => cardHTML(byId[id], i + 1)).join("");
  main.innerHTML = html;
}

function renderAll() { tally(); renderRail(); renderMain(); }
function refreshCard(id) {
  const el = document.getElementById("q-" + id); if (!el) return renderAll();
  const n = el.querySelector(".qnum").textContent;
  el.outerHTML = cardHTML(byId[id], n);
  tally(); renderRail();
}

function answer(q, picked, dk) {
  const ok = !dk && picked.length === q.key.length && picked.every(k => q.key.includes(k));
  S.answers[q.id] = { picked, dk: !!dk, ok, at: Date.now() };
  S.redo = S.redo.filter(x => x !== q.id);
  delete pending[q.id]; save(); refreshCard(q.id);
}

document.addEventListener("click", e => {
  const t = e.target.closest("button, .cell"); if (!t) return;
  if (t.dataset.jump) {
    e.stopPropagation();
    const id = t.dataset.jump;
    if (!document.getElementById("q-" + id)) { S.scope = "p" + byId[id].part; save(); renderAll(); }
    const el = document.getElementById("q-" + id);
    el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
    return;
  }
  if (t.dataset.scope) { S.scope = t.dataset.scope; save(); renderAll(); window.scrollTo(0, 0); return; }
  if (t.dataset.q) {
    const q = byId[t.dataset.q];
    if (t.dataset.k === "?") return answer(q, [], true);
    if (q.key.length > 1) {
      const p = pending[q.id] = pending[q.id] || [];
      const i = p.indexOf(t.dataset.k); i >= 0 ? p.splice(i, 1) : p.push(t.dataset.k);
      t.classList.toggle("picked"); return;
    }
    return answer(q, [t.dataset.k], false);
  }
  if (t.dataset.check && !(pending[t.dataset.check] || []).length) return toast("Pick at least one option first");
  if (t.dataset.check) { const q = byId[t.dataset.check]; return answer(q, (pending[q.id] || []).slice().sort(), false); }
  if (t.dataset.open) { S.answers[t.dataset.open] = { picked: [], dk: false, ok: true, open: true }; save(); return refreshCard(t.dataset.open); }
  if (t.dataset.flag) { const id = t.dataset.flag; S.flags[id] ? delete S.flags[id] : (S.flags[id] = Date.now()); save(); return refreshCard(id); }
  if (t.dataset.retry) { if (isMiss(t.dataset.retry) && !S.redo.includes(t.dataset.retry)) S.redo.push(t.dataset.retry); delete S.answers[t.dataset.retry]; save(); return refreshCard(t.dataset.retry); }
});

function setOrder(o) { S.order = o; save(); syncControls(); renderMain(); }
function syncControls() {
  document.getElementById("ord-seq").setAttribute("aria-pressed", S.order === "seq");
  document.getElementById("ord-rnd").setAttribute("aria-pressed", S.order === "rnd");
  document.getElementById("reshuffle").hidden = S.order !== "rnd";
}
document.getElementById("ord-seq").onclick = () => setOrder("seq");
document.getElementById("ord-rnd").onclick = () => {
  // random means mixed across topics, like a real test; a part can still be picked afterwards
  if (S.order !== "rnd" && S.scope.startsWith("p")) { S.scope = "all"; renderRail(); window.scrollTo(0, 0); }
  setOrder("rnd");
};
document.getElementById("reshuffle").onclick = () => { S.seed = (Math.random() * 2 ** 31) | 0; save(); renderMain(); window.scrollTo(0, 0); toast("Reshuffled"); };

// Reset: "idle" -> "confirm" (inline Missed / Marked / All / Cancel) -> pick -> "undo" for 8 s -> "idle".
// Clears answers only; marks and order stay. Missed and Marked clear just that set (Missed then shows the cleared ones to redo).
const clearBox = document.getElementById("clearbox");
let clearMode = "idle", undoSnap = null, undoRedo = null, undoCount = 0, undoWhat = "", undoTimer = null, undoAt = 0;
const CLEAR_SETS = { miss: "Missed", flag: "Marked", all: "All" };
const clearIds = w => Object.keys(S.answers).filter(id => w === "all" || (w === "miss" ? isMiss(id) : !!S.flags[id]));
const nAns = () => Object.keys(S.answers).length;
const nAnsText = n => `${n} answer${n === 1 ? "" : "s"}`;
function positionPop() { // keep the panel on screen at phone width
  const p = clearBox.querySelector(".pop"); if (!p) return;
  p.style.transform = ""; const r = p.getBoundingClientRect();
  const dx = r.right > innerWidth - 8 ? innerWidth - 8 - r.right : r.left < 8 ? 8 - r.left : 0;
  if (dx) p.style.transform = `translateX(${dx}px)`;
}
function renderClear() {
  if (clearMode === "confirm" && !nAns()) clearMode = "idle";
  clearBox.innerHTML = `<button class="btn danger" id="reset" type="button" title="Clear answers: missed, marked or all (asks first; marks are kept)"${clearMode === "confirm" ? ' aria-expanded="true"' : ""}>Reset</button>` + (
    clearMode === "confirm"
    ? `<span class="pop"><span class="ask">Clear:</span>${Object.entries(CLEAR_SETS).map(([w, label]) => { const n = clearIds(w).length;
        return `<button class="btn danger solid" type="button" data-clear="${w}" title="Clear ${nAnsText(n)}"${n ? "" : " disabled"}>${label} <span data-n>${n}</span></button>`; }).join("")}<button class="btn" id="clearNo" type="button">Cancel</button></span>`
    : clearMode === "undo"
    ? `<span class="pop"><span class="done">Cleared ${nAnsText(undoCount)}${undoWhat === "all" ? "" : ` (${CLEAR_SETS[undoWhat].toLowerCase()})`}; marks kept.</span><button class="btn" id="clearUndo" type="button">Undo</button></span>`
    : "");
  positionPop();
}
// keep the counts current if answers or marks change while the question is open
function updateClearAsk() {
  if (clearMode !== "confirm") return;
  clearBox.querySelectorAll("[data-clear]").forEach(b => { const n = clearIds(b.dataset.clear).length; b.querySelector("[data-n]").textContent = n; b.title = `Clear ${nAnsText(n)}`; b.disabled = !n; });
}
function endUndo() { clearTimeout(undoTimer); undoTimer = null; undoSnap = null; undoRedo = null; }
function clearToIdle() { endUndo(); clearMode = "idle"; renderClear(); document.getElementById("reset").focus(); }
clearBox.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "reset") {
    if (clearMode === "confirm") return clearToIdle(); // a second click on Reset cancels
    if (!nAns()) return toast("No answers to clear");
    endUndo(); clearMode = "confirm"; renderClear(); document.getElementById("clearNo").focus();
  } else if (b.id === "clearNo") clearToIdle();
  else if (b.dataset.clear) {
    const w = b.dataset.clear, ids = clearIds(w); if (!ids.length) return;
    undoSnap = { ...S.answers }; undoRedo = S.redo.slice(); undoCount = ids.length; undoWhat = w;
    if (w === "all") { S.answers = {}; S.redo = []; for (const k in pending) delete pending[k]; }
    else {
      ids.forEach(id => { if (isMiss(id) && !S.redo.includes(id)) S.redo.push(id); });
      ids.forEach(id => { delete S.answers[id]; delete pending[id]; });
      S.scope = w; // straight to the cleared set, ready to redo
    }
    save();
    clearMode = "undo"; renderClear(); renderAll(); if (w !== "all") window.scrollTo(0, 0);
    undoAt = performance.now(); document.getElementById("clearUndo").focus();
    undoTimer = setTimeout(() => {
      const hadFocus = document.activeElement && document.activeElement.id === "clearUndo";
      endUndo(); clearMode = "idle"; renderClear(); if (hadFocus) document.getElementById("reset").focus();
    }, 8000);
  } else if (b.id === "clearUndo") {
    if (performance.now() - undoAt < 400) return; // the second click of a double-click on "Yes" must not undo
    if (undoSnap) S.answers = { ...undoSnap, ...S.answers }; // anything answered since the clear wins
    if (undoRedo) S.redo = [...new Set(undoRedo.concat(S.redo))].filter(id => !S.answers[id]);
    save(); renderAll(); clearToIdle();
  }
});
clearBox.addEventListener("mousedown", e => { if (!e.target.closest("button")) e.preventDefault(); }); // a click on the label keeps focus on Undo
clearBox.addEventListener("keydown", e => { if (e.repeat && (e.key === "Enter" || e.key === " ")) e.preventDefault(); }); // holding Enter on Yes must not reach Undo
addEventListener("keydown", e => { if (e.key === "Escape" && clearMode === "confirm") clearToIdle(); });

function toast(msg) { const d = document.createElement("div"); d.className = "toast"; d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 1800); }
const plain = h => { const d = document.createElement("div"); d.innerHTML = h; return d.textContent.replace(/\s+/g, " ").trim(); };

document.getElementById("copy").onclick = () => {
  const miss = Q.filter(q => isMiss(q.id));
  if (!miss.length && !Object.keys(S.flags).length) return toast("Nothing missed or marked yet");
  const ans = Q.filter(q => q.options.length && state(q.id));
  const lines = [`Mock midterm: ${ans.filter(q => state(q.id) === "right").length}/${ans.length} right of those answered (${new Date().toLocaleString("en-CA")})`, ""];
  const wrong = miss.filter(q => state(q.id) === "wrong"), dk = miss.filter(q => state(q.id) === "dk");
  lines.push(`Guessed wrong (${wrong.length}):`);
  wrong.forEach(q => lines.push(`- ${q.id} ${plain(q.title)}: picked ${S.answers[q.id].picked.join(", ")}, answer ${q.key.join(", ")}`));
  lines.push("", `Didn't know (${dk.length}):`);
  dk.forEach(q => lines.push(`- ${q.id} ${plain(q.title)}: answer ${q.key.join(", ")}`));
  const fl = Q.filter(q => S.flags[q.id]);
  lines.push("", `Marked as unsure (${fl.length}):`);
  fl.forEach(q => lines.push(`- ${q.id} ${plain(q.title)}: ${state(q.id) || "not answered"}${S.answers[q.id] && !S.answers[q.id].open ? `, picked ${S.answers[q.id].picked.join(", ") || "?"}, answer ${q.key.join(", ")}` : ""}`));
  const text = lines.join("\n");
  const fallback = () => { document.querySelectorAll("textarea.fallback").forEach(x => x.remove()); const ta = document.createElement("textarea"); ta.className = "fallback"; ta.value = text; document.getElementById("main").prepend(ta); ta.select(); toast("Copy the selected text"); };
  try { navigator.clipboard.writeText(text).then(() => toast(`Copied ${miss.length} misses and ${Object.keys(S.flags).length} marks`), fallback); } catch (e) { fallback(); }
};

addEventListener("storage", e => {
  if (e.key !== STORE || !e.newValue) return;
  try { const o = JSON.parse(e.newValue); S.answers = o.answers || {}; S.flags = o.flags || {}; S.redo = Array.isArray(o.redo) ? o.redo : []; renderAll(); } catch (err) {}
});
const totop = document.getElementById("totop");
totop.onclick = () => window.scrollTo(0, 0);
addEventListener("scroll", () => { totop.hidden = scrollY < 1200; }, { passive: true });
// keep --hdr equal to the header's height (used only by the portrait rules above)
const bar = document.querySelector("header.bar");
const setHdr = () => document.documentElement.style.setProperty("--hdr", bar.offsetHeight + "px");
setHdr(); if (window.ResizeObserver) new ResizeObserver(setHdr).observe(bar);
syncControls(); renderAll();
</script>
